<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Logistics Portal - Interactive Prototype</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--surface2:#f8fafc;--text:#172033;--muted:#667085;--line:#e3e8ef;--brand:#1d4ed8;--brand2:#0ea5e9;--brandbg:#e8efff;--ok:#16794a;--okbg:#e3f6ec;--warn:#a15c00;--warnbg:#fff3df;--bad:#b42318;--badbg:#fde8e6;--info:#175cd3;--infobg:#e6f0ff;--mutedbg:#eef1f5;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);--r:10px;--side:#0f1b33;--sidetext:#b9c4dc;--land:#eef2e9;--road:#fff;--roadm:#f7d9a6;--water:#bfdcf5;--park:#cfe6c3;--zone:#1d4ed8}
[data-theme=dark]{--bg:#0e131b;--surface:#161d28;--surface2:#1b2432;--text:#e6ebf3;--muted:#98a4b6;--line:#2a3445;--brand:#6c9bff;--brand2:#38bdf8;--brandbg:#1b2a4a;--ok:#5ad39a;--okbg:#10291e;--warn:#f1b04f;--warnbg:#33290f;--bad:#ff8f84;--badbg:#3a1a17;--info:#7db0ff;--infobg:#172745;--mutedbg:#222c3b;--shadow:0 1px 2px rgba(0,0,0,.4);--side:#0a1020;--land:#1a2230;--road:#222c3d;--roadm:#4a4030;--water:#17324a;--park:#1d3326;--zone:#6c9bff}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}.sm{font-size:12.5px}.xs{font-size:11.5px}.b{font-weight:600}.right{text-align:right}.grow{flex:1}.nowrap{white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.g2{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}.g3{display:grid;gap:14px;grid-template-columns:repeat(3,minmax(0,1fr))}.g4{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}.g21{display:grid;gap:14px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mt{margin-top:14px}.mb{margin-bottom:14px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface2)}.btn.sm{padding:4px 9px;font-size:12px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
[data-theme=dark] .btn.pri{color:#0b1220}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}[data-theme=dark] .btn.ok{color:#0b1220}
.btn.bad{background:var(--badbg);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}
/* forms */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
input[type=checkbox],input[type=radio]{width:auto}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid .full{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:12px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.flat{box-shadow:none}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}.ch h3{font-size:15px}
.kpi{display:flex;gap:12px;align-items:center}.kic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--brandbg);color:var(--brand);flex:none}
.kic.ok{background:var(--okbg);color:var(--ok)}.kic.warn{background:var(--warnbg);color:var(--warn)}.kic.bad{background:var(--badbg);color:var(--bad)}
.kv{font-size:22px;font-weight:700;line-height:1.2}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}.ph h2{font-size:21px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-info{background:var(--infobg);color:var(--info)}.b-muted{background:var(--mutedbg);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700}
.chip.binance{background:#fff4c7;color:#6b5200}.chip.bybit{background:#1c1c1c;color:#f7a600}
.note{background:var(--warnbg);border-left:4px solid var(--warn);padding:9px 12px;border-radius:6px;font-size:13px}
.note.info{background:var(--infobg);border-color:var(--info)}.note.ok{background:var(--okbg);border-color:var(--ok)}
/* tables */
.tblbox .tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 9px;min-width:200px}.sbox input{border:0;padding:7px 0;background:transparent}.sbox input:focus{outline:0}
.tbar select{width:auto;padding:6px 8px;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:var(--surface2);text-align:left;padding:9px 11px;font-size:12px;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line);user-select:none}
.t th[data-act]{cursor:pointer}.t td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}.t tbody tr.clk{cursor:pointer}.t tbody tr.clk:hover{background:var(--surface2)}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:26px;color:var(--muted)}
/* layout */
.side{width:240px;background:var(--side);color:var(--sidetext);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.side .logo{display:flex;align-items:center;gap:10px;padding:16px 18px;color:#fff;font-weight:800;font-size:16px}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#0ea5e9);display:grid;place-items:center;color:#fff}
.nav{flex:1;overflow-y:auto;padding:4px 10px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:8px;color:var(--sidetext);font-weight:500;margin:1px 0}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}.nav a.on{background:rgba(96,165,250,.18);color:#fff}
.nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6c7a99;padding:12px 11px 4px}
.side .foot{padding:12px 16px;font-size:12px;border-top:1px solid rgba(255,255,255,.08)}
.main{margin-left:240px;min-width:0}
.top{height:58px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:30}
.top select{width:auto;padding:5px 8px;font-size:13px}
.content{padding:20px;max-width:1440px;margin:0 auto}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brandbg);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px}
.menubtn{display:none}
.dd{position:absolute;right:0;top:44px;width:340px;max-width:90vw;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:60;max-height:70vh;overflow:auto}
.dd .it{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.dd .it:hover{background:var(--surface2)}.dd .it.un{background:var(--infobg)}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(10,16,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:100;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.modal.wide{max-width:980px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.mh h3{font-size:16px}
.mb2{padding:18px}.x{border:0;background:transparent;cursor:pointer;color:var(--muted)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#172033;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:340px;font-size:13px;border-left:4px solid var(--brand2);animation:ti .2s}
.toast.ok{border-color:#34d399}.toast.bad{border-color:#f87171}.toast.warn{border-color:#fbbf24}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* misc */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}.tabs a,.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted)}.tabs .on{color:var(--brand);border-color:var(--brand)}
.steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.step{flex:1;min-width:110px;padding:8px 10px;border-radius:8px;background:var(--mutedbg);color:var(--muted);font-size:12.5px;font-weight:600}.step.on{background:var(--brand);color:#fff}.step.done{background:var(--okbg);color:var(--ok)}
[data-theme=dark] .step.on{color:#0b1220}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}.opt.on{border-color:var(--brand);background:var(--brandbg)}.opt.off{opacity:.45;cursor:not-allowed}
.timeline{list-style:none;margin:0;padding:0 0 0 6px}.timeline li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:6px}.timeline li:last-child{border-color:transparent}
.timeline li:before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}.timeline li.fut:before{background:var(--line)}.timeline li.fut{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--mutedbg);overflow:hidden}.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}.bar.warn>i{background:#e5a100}.bar.bad>i{background:var(--bad)}
.sw{position:relative;display:inline-block;width:40px;height:22px;flex:none}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;background:var(--line);border-radius:99px;cursor:pointer;transition:.15s}.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}.sw input:checked+span{background:var(--brand)}.sw input:checked+span:before{transform:translateX(18px)}
.kvs{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px}.kvs dt{color:var(--muted)}.kvs dd{margin:0}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--mutedbg);font-size:11.5px}
.sig{border:1.5px dashed var(--line);border-radius:8px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
/* map */
svg.map{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block;background:var(--land)}
.m-land{fill:var(--land)}.m-water{fill:var(--water)}.m-park{fill:var(--park)}.m-road{stroke:var(--road);stroke-width:3;fill:none}.m-roadm{stroke:var(--roadm);stroke-width:5;fill:none;opacity:.8}
.m-zone{fill:none;stroke:var(--zone);stroke-width:1.5;stroke-dasharray:8 6;opacity:.45}.m-zl{fill:var(--zone);font-size:15px;font-weight:700;opacity:.7}
.m-lbl{font-size:12px;fill:var(--text);font-weight:600;paint-order:stroke;stroke:var(--land);stroke-width:3px}.m-lm{fill:var(--muted);opacity:.6}
.mk{cursor:pointer}.mk text{font-size:10px;font-weight:800;fill:#fff;text-anchor:middle;pointer-events:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.chart text{fill:var(--muted);font-size:11px}.chart .gl{stroke:var(--line);stroke-width:1}
/* public */
.pub{background:var(--surface)}
.pnav{display:flex;align-items:center;gap:18px;padding:0 24px;height:64px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:30}
.pnav .lk{display:flex;gap:4px;flex:1;flex-wrap:wrap}.pnav .lk a{padding:6px 11px;border-radius:8px;color:var(--text);font-weight:600}.pnav .lk a.on,.pnav .lk a:hover{background:var(--brandbg);color:var(--brand)}
.logo2{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;color:var(--text)}
.hero{background:linear-gradient(120deg,#0f1b33,#1d4ed8 60%,#0ea5e9);color:#fff;padding:56px 24px}
.hero .in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:40px}.hero p{opacity:.9;font-size:16px}
.hero .box{background:var(--surface);color:var(--text);border-radius:14px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sec{max-width:1100px;margin:0 auto;padding:40px 24px}.sec h2{font-size:26px;margin-bottom:6px}
.pfoot{background:#0f1b33;color:#b9c4dc;padding:30px 24px;margin-top:20px}.pfoot .in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
details.faq{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px;background:var(--surface)}details.faq summary{cursor:pointer;font-weight:700}
/* driver phone */
body.drv .main{margin-left:0}body.drv .side{display:none}
.phoneWrap{display:flex;justify-content:center;padding:16px}
.phone{width:410px;max-width:100%;background:var(--bg);border:10px solid #10151f;border-radius:36px;min-height:780px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.phone .ph-top{background:var(--brand);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}[data-theme=dark] .phone .ph-top{color:#0b1220}
.phone .ph-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.phone .ph-nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}.phone .ph-nav a{flex:1;text-align:center;padding:10px 4px;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}.phone .ph-nav a.on{color:var(--brand)}
.drvbar{max-width:410px;margin:10px auto 0;padding:0 10px}.drvbar select{width:auto;padding:5px 8px;font-size:13px}
.phone .iconbtn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff;width:34px;height:34px}.phone .ph-top .dd{color:var(--text)}
@media(max-width:560px){.phoneWrap{padding:0}.phone{border:0;border-radius:0;width:100%;min-height:100vh}.drvbar{display:none}}
/* responsive */
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:1fr}.hero .in{grid-template-columns:1fr}}
@media(max-width:860px){.side{transform:translateX(-100%)}.side.open{transform:none}.main{margin-left:0}.menubtn{display:grid}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.content{padding:14px}.hero h1{font-size:30px}.top .hide-s{display:none}}
@media(max-width:520px){.g4{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;left:0;top:0;width:100%}.overlay{background:#fff}.no-print{display:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="modal-root"></div><div id="toasts"></div>
<script>
'use strict';
/* ================= UTIL ================= */
const KEY='nexus_proto_v3';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5,HOUR=36e5,MIN=6e4;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const pad=(n,l=2)=>String(n).padStart(l,'0');
const fdate=t=>new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
const fdt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ago=t=>{const m=Math.round((Date.now()-t)/MIN);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);return h<48?h+' h ago':Math.round(h/24)+' d ago'};
const r2=v=>Math.round(v*100)/100;
const byId=(a,id)=>a.find(x=>x.id===id);
const initials=n=>String(n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= GEOMETRY ================= */
const zoneIdx=(x,y)=>(x<500?0:1)+(y<320?0:2);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const km=(a,b)=>Math.max(1,r2(dist(a,b)*0.022*1.25));
const zoneHops=(a,b)=>Math.abs(a%2-b%2)+Math.abs(Math.floor(a/2)-Math.floor(b/2));
function pathPts(s){return [{x:s.pickup.x,y:s.pickup.y},{x:s.drop.x,y:s.pickup.y},{x:s.drop.x,y:s.drop.y}]}
function pathLen(p){let l=0;for(let i=1;i<p.length;i++)l+=dist(p[i-1],p[i]);return l||1}
function pointAt(p,t){let L=pathLen(p)*clamp(t,0,1),acc=0;for(let i=1;i<p.length;i++){const d=dist(p[i-1],p[i]);if(acc+d>=L||i===p.length-1){const f=d?(L-acc)/d:0;return{x:p[i-1].x+(p[i].x-p[i-1].x)*f,y:p[i-1].y+(p[i].y-p[i-1].y)*f}}acc+=d}return p[p.length-1]}

const chargeable=items=>sum(items,i=>Math.max(i.weight,(i.l*i.w*i.h)/5000)*i.qty);
function quote(cityId,pickup,drop,items,type){
  const r=DB.rules[cityId],c=city(cityId),k=km(pickup,drop),wt=r2(chargeable(items)),mult=r.mult[type]||1;
  const distFee=r.perKm*k,wtFee=r.perKg*wt,raw=r.base+distFee+wtFee,sub=Math.max(r.min,raw)*mult;
  const hops=zoneHops(pickup.zone,drop.zone),zoneFee=hops*r.zone,pre=sub+zoneFee,tax=pre*r.tax,dec=c.cur==='GHS'?2:0;
  const f=v=>dec?r2(v):Math.round(v);
  return{km:k,wt,base:f(r.base),distFee:f(distFee),wtFee:f(wtFee),mult,minApplied:raw<r.min,typeAdj:f(sub-Math.max(raw,r.min)+(raw<r.min?r.min-raw:0)),sub:f(sub),hops,zoneFee:f(zoneFee),tax:f(tax),total:f(pre+tax),cur:c.cur}
}

    const type=pick(['standard','standard','express','express','same_day','scheduled']);

    if(seq.includes('assigned')&&st!=='cancelled'||(st==='cancelled'&&seq.includes('assigned'))){const cd=db.drivers.filter(d=>d.city===c.id);const d=cd[rr[c.id]++%cd.length];s.driverId=d.id;s.vehicleId=d.vehicleId;s.accepted=true}
    const end=old?Math.min(now-2*HOUR,created+rnd(3,9)*HOUR):now-3*MIN,step=(end-created)/Math.max(1,seq.length-1);
    s.history=seq.map((x,i)=>({t:Math.round(created+step*i),status:x,by:i===0?cu.name:x==='cancelled'?cu.name:'System',note:x==='on_hold'?'Receiver requested delay':x==='delivery_failed'?'Receiver unavailable':''}));
    s.status=st;if(st==='on_hold')s.prevStatus='picked_up';

    if(st==='delivered'){s.pod={receiver:pick(['Ada Bello','Musa Kariuki','Kofi Mensah','Zawadi Otieno']),rel:'Recipient',sig:null,photo:null,t:s.history[s.history.length-1].t};s.rating=ri(4,5);s.progress=1;const P=pathPts(s);for(let k=0;k<=5;k++)s.track.push({t:created+HOUR+k*20*MIN,...pointAt(P,k/5)})}

function newShipment(o,quiet){

function seedPay(s,st,R,pick,pm){

  if(st==='cancelled'){if(s.method!=='cod'&&s.method!=='bank'){mkPay('refunded');s.payStatus='refunded'}return}
  if(s.method==='cod'){if(st==='delivered'){mkPay('cod_collected',{remitted:R()>.45,t:s.history[s.history.length-1].t});s.payStatus='cod_collected';mkInv(s)}else{mkPay('cod_pending');s.payStatus='cod_pending'}return}

}
function mkInv(s){if(s.invoiceId)return;const i={id:'inv'+(++DB.seq.inv),no:'INV-2026-'+pad(DB.seq.inv,5),shipId:s.id,customerId:s.customerId,t:Date.now()-0,total:s.price.total,tax:s.price.tax,cur:s.currency,status:s.payStatus==='paid'||s.payStatus==='cod_collected'?'Paid':'Open'};i.t=s.created+10*MIN;DB.invoices.push(i);s.invoiceId=i.id}

/* ================= WORKFLOW ENGINE ================= */
function notify(userId,text,shipId){if(!userId)return;DB.notifs.unshift({id:'n'+Date.now()+Math.random().toString(36).slice(2,5),to:userId,t:Date.now(),text,shipId,read:false});DB.notifs.length=Math.min(DB.notifs.length,300)}
function out(ch,to,subject,body){DB.outbox.unshift({t:Date.now(),ch,to,subject,body});DB.outbox.length=Math.min(DB.outbox.length,150)}
function notifyOps(s,text){DB.users.filter(u=>(u.role==='dispatcher'&&u.city===s.city)||u.role==='admin').forEach(u=>notify(u.id,text,s.id))}
function setStatus(s,to,by,note){
  const from=s.status;if(to==='on_hold')s.prevStatus=from;
  s.status=to;s.history.push({t:Date.now(),status:to,by:by||(me()?me().name:'System'),note:note||''});
  const cu=cust(s.customerId),label=STATUS[to],txt=`Shipment ${s.tracking}: ${label}${note?' - '+note:''}`;
  notify(cu.id,txt,s.id);
  if(DB.settings.channels.email&&['delivered','delivery_failed','cancelled','assigned'].includes(to))out('email',cu.email,`Shipment ${s.tracking}: ${label}`,txt);
  if(DB.settings.channels.sms&&['picked_up','out_for_delivery','delivered','delivery_failed'].includes(to))out('sms',cu.phone,'',txt);
  if(DB.settings.channels.push&&s.driverId&&to==='assigned')out('push',drvName(s.driverId),'New job',`New job ${s.tracking}`);
  if(to==='assigned'&&s.driverId)notify(drv(s.driverId).userId,`New job assigned: ${s.tracking}`,s.id);
  if(['delivery_failed','on_hold'].includes(to))notifyOps(s,txt);
  const d=s.driverId?drv(s.driverId):null;
  if(to==='picked_up'&&d){s.progress=0;s.gps=false;d.pos={x:s.pickup.x,y:s.pickup.y}}
  if(to==='in_transit'&&d){d.status='on_job';s.gps=true;s.arrived=false}
  if(['delivered','delivery_failed','returned','cancelled','pending'].includes(to)){s.gps=false;if(d){if(to==='pending'||to==='cancelled'){}d.status=DB.shipments.some(x=>x!==s&&x.driverId===d.id&&MOVING.includes(x.status))?'on_job':(d.online?'available':'offline')}}
  if(to==='pending'){s.driverId=null;s.vehicleId=null;s.accepted=false}
  if(to==='delivered'){s.arrived=true;if(d){d.delivered++}if(s.method==='cod'){const p=DB.payments.find(x=>x.shipId===s.id);if(p){p.status='cod_collected';p.t=Date.now();s.payStatus='cod_collected'}}mkInv(s);const iv=byId(DB.invoices,s.invoiceId);if(iv&&['paid','cod_collected'].includes(s.payStatus))iv.status='Paid'}
  if(to==='cancelled'){const p=DB.payments.find(x=>x.shipId===s.id&&x.status==='paid');if(p){p.status='refunded';s.payStatus='refunded';notify(cu.id,`Refund of ${money(p.amount,p.cur)} issued for ${s.tracking} (simulated)`,s.id)}}
  save();
}
function resumeTarget(s){return s.prevStatus&&FLOW[s.prevStatus]?s.prevStatus:'pending'}
function assign(s,driverId,by){const d=drv(driverId);s.driverId=d.id;s.vehicleId=d.vehicleId;s.accepted=false;if(s.status==='pending')setStatus(s,'assigned',by||me().name,'Assigned to '+drvName(d.id));else{s.history.push({t:Date.now(),status:s.status,by:by||me().name,note:'Reassigned to '+drvName(d.id)});notify(d.userId,`Job reassigned to you: ${s.tracking}`,s.id)}audit('Assign',`${s.tracking} -> ${drvName(d.id)}`);save()}
function createPayment(s,method,status,extra){const p={id:'p'+(++DB.seq.pay),shipId:s.id,userId:s.customerId,method,amount:s.price.total,cur:s.currency,status,t:Date.now(),ref:'PAY-'+hex(8).toUpperCase(),remitted:false,...extra};if(method==='binance'||method==='bybit'){p.crypto=r2(toUSD(p.amount,p.cur));p.asset='USDT'}DB.payments.unshift(p);s.method=method;return p}
function markPaid(s,p){p.status='paid';p.t=Date.now();s.payStatus='paid';mkInv(s);byId(DB.invoices,s.invoiceId).status='Paid';notify(s.customerId,`Payment of ${money(p.amount,p.cur)} received for ${s.tracking} via ${METHODS[p.method]}`,s.id);notifyOps(s,`Payment received for ${s.tracking} (${METHODS[p.method]})`);save()}

/* ================= TICKER (simulated GPS) ================= */
function tick(){
  if(UI.paused||!DB)return;UI.tick++;let moved=false;
  DB.shipments.forEach(s=>{
    if(!MOVING.includes(s.status)||!s.gps||!s.driverId)return;const d=drv(s.driverId);
    if(d.locked&&!DB.settings.capacitorBg)return;
    const P=pathPts(s),L=pathLen(P);if(s.progress>=1&&s.arrived)return;
    s.progress=Math.min(1,s.progress+(16*UI.speed)/L);const p=pointAt(P,s.progress);d.pos=p;d.battery=Math.max(5,d.battery-(UI.tick%40===0?1:0));moved=true;
    if(s.progress>=1&&!s.arrived){s.arrived=true;notifyOps(s,`${drvName(d.id)} arrived at drop-off for ${s.tracking}`);notify(s.customerId,`Your driver has arrived with ${s.tracking}`,s.id);if(role()!=='customer'||s.customerId===me().id)toast(`${drvName(d.id)} arrived at drop-off (${s.tracking})`,'ok')}
    if(UI.tick%3===0){s.track.push({t:Date.now(),x:p.x,y:p.y});if(s.track.length>300)s.track.shift()}
  });
  if(moved){liveSync();if(UI.tick%6===0)save()}
}
function liveSync(){
  $$('[data-mk^="d:"]').forEach(g=>{const d=drv(g.dataset.mk.slice(2));if(d)g.setAttribute('transform',`translate(${d.pos.x} ${d.pos.y})`)});
  $$('polyline[data-trk]').forEach(pl=>{const s=shipById(pl.dataset.trk);if(s)pl.setAttribute('points',trackPts(s))});
  $$('[data-prog]').forEach(el=>{const s=shipById(el.dataset.prog);if(s)el.textContent=Math.round(s.progress*100)+'%'});
  $$('[data-progbar]').forEach(el=>{const s=shipById(el.dataset.progbar);if(s)el.style.width=Math.round(s.progress*100)+'%'});
}
const trackPts=s=>{const pts=s.track.map(p=>`${p.x},${p.y}`);return pts.join(' ')};

  let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(o.label||'Line chart')}">`;
  for(let i=0;i<=4;i++){const y=m.t+(h-m.t-m.b)*i/4;s+=`<line class="gl" x1="${m.l}" x2="${w-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${(o.fmt||(v=>Math.round(v)))(mx*(1-i/4))}</text>`}
  const pts=data.map((d,i)=>`${X(i)},${Y(d.v)}`).join(' ');s+=`<polygon points="${X(0)},${h-m.b} ${pts} ${X(data.length-1)},${h-m.b}" fill="${o.color||'var(--brand)'}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${o.color||'var(--brand)'}" stroke-width="2.5"/>`;
  data.forEach((d,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(d.v)}" r="3.5" fill="${o.color||'var(--brand)'}"><title>${esc(d.l)}: ${(o.fmt||(v=>v))(d.v)}</title></circle>`;if(i%Math.ceil(data.length/7)===0)s+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${esc(d.l)}</text>`});return s+'</svg>'}
function donut(data,o={}){const t=sum(data,d=>d.v)||1;let a=-Math.PI/2,s=`<svg viewBox="0 0 220 220" width="${o.size||190}" role="img" aria-label="${esc(o.label||'Donut chart')}"><g transform="translate(110 110)">`;
  data.forEach((d,i)=>{const f=d.v/t,b=a+f*Math.PI*2,big=f>.5?1:0;if(f>0){const p=(r,ang)=>[Math.cos(ang)*r,Math.sin(ang)*r];const [x1,y1]=p(90,a),[x2,y2]=p(90,b),[x3,y3]=p(56,b),[x4,y4]=p(56,a);s+=f>=.999?`<circle r="73" fill="none" stroke="${d.c||PAL[i%8]}" stroke-width="34"/>`:`<path d="M${x1} ${y1}A90 90 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A56 56 0 ${big} 0 ${x4} ${y4}Z" fill="${d.c||PAL[i%8]}"><title>${esc(d.l)}: ${d.v}</title></path>`}a=b});
  return s+`<text text-anchor="middle" y="6" style="font-size:22px;font-weight:700;fill:var(--text)">${o.center!=null?o.center:t}</text></g></svg>`}
const legend=d=>`<div class="legend">${d.map((x,i)=>`<span><i style="background:${x.c||PAL[i%8]}"></i>${esc(x.l)} (${x.v})</span>`).join('')}</div>`;

function mapSVG(cityId,o={}){const c=city(cityId);let s=`<svg class="map" viewBox="0 0 1000 640" ${o.id?`id="${o.id}"`:''} role="img" aria-label="Map of ${esc(c.name)}"><rect width="1000" height="640" class="m-land"/>`;
  if(cityId==='LOS')s+='<path class="m-water" d="M0 590C180 540 380 620 600 585C780 555 900 610 1000 575L1000 640L0 640Z"/><path class="m-water" d="M700 0C720 80 690 140 740 200L790 190C760 130 780 70 760 0Z"/>';else if(cityId==='ACC')s+='<path class="m-water" d="M0 600C200 570 420 625 640 600C820 580 930 620 1000 600L1000 640L0 640Z"/>';else s+='<rect x="40" y="440" width="140" height="110" rx="20" class="m-park"/>';
  s+='<rect x="560" y="250" width="130" height="80" rx="16" class="m-park"/><rect x="230" y="60" width="90" height="60" rx="12" class="m-park"/>';
  for(let x=0;x<=1000;x+=40)s+=`<path class="${x%160===0?'m-roadm':'m-road'}" d="M${x} 0V640"/>`;for(let y=0;y<=640;y+=40)s+=`<path class="${y%160===0?'m-roadm':'m-road'}" d="M0 ${y}H1000"/>`;
  [[0,0],[500,0],[0,320],[500,320]].forEach((z,i)=>{s+=`<rect class="m-zone" x="${z[0]+3}" y="${z[1]+3}" width="494" height="314"/><text class="m-zl" x="${z[0]+14}" y="${z[1]+26}">${esc(c.zones[i])}</text>`});

  (o.paths||[]).forEach(p=>{s+=`<polyline ${p.trk?`data-trk="${p.trk}"`:''} points="${p.pts}" fill="none" stroke="${p.color||'#2563eb'}" stroke-width="${p.w||5}" ${p.dash?'stroke-dasharray="10 8"':''} stroke-linecap="round" stroke-linejoin="round" opacity="${p.op||.9}"/>`});
  (o.markers||[]).forEach(m=>{s+=`<g class="mk" data-mk="${m.k}" transform="translate(${m.x} ${m.y})" ${m.act?`data-act="${m.act}" data-id="${esc(m.id)}"`:''}><circle r="${m.r||12}" fill="${m.color}" stroke="#fff" stroke-width="3"/><text y="3.5">${esc(m.txt||'')}</text><title>${esc(m.title||'')}</title></g>`});
  return s+'</svg>'}
const pathStr=pp=>pp.map(p=>`${p.x},${p.y}`).join(' ');
function driverMarker(d,extra={}){const col=d.status==='on_job'?'#f59e0b':d.status==='available'?'#16a34a':'#94a3b8';return{k:'d:'+d.id,x:d.pos.x,y:d.pos.y,color:col,txt:initials(drvName(d.id)),title:`${drvName(d.id)} (${d.status.replace('_',' ')})`,r:13,...extra}}

/* ---------- shared: tracking view ---------- */
function etaMin(s){const rem=(1-s.progress)*pathLen(pathPts(s))*0.022*1.25;return Math.max(1,Math.round(rem/28*60))}
function trackView(s,o={}){const pub=o.pub,pk=s.pickup,dr=s.drop,d=s.driverId?drv(s.driverId):null;const live=d&&['assigned','picked_up','in_transit','out_for_delivery'].includes(s.status);
  const markers=[{k:'p:'+s.id,x:pk.x,y:pk.y,color:'#2563eb',txt:'P',title:'Pickup: '+pk.label},{k:'t:'+s.id,x:dr.x,y:dr.y,color:'#16a34a',txt:'D',title:'Drop-off: '+dr.label}];if(live)markers.push(driverMarker(d));
  const m=mapSVG(s.city,{markers,paths:[{pts:pathStr(pathPts(s)),color:'#94a3b8',dash:true,w:4},{pts:trackPts(s),color:'#2563eb',trk:s.id}]});
  const idx=SEQ.indexOf(s.status);const fut=idx>=0&&idx<5?SEQ.slice(idx+1):[];
  const tl=`<ul class="timeline">${s.history.map(h=>`<li><div class="b">${STATUS[h.status]}</div><div class="xs muted">${fdt(h.t)}${pub?'':' · '+esc(h.by)}${h.note?' · '+esc(h.note):''}</div></li>`).join('')}${fut.map(f=>`<li class="fut"><div>${STATUS[f]}</div><div class="xs">Expected</div></li>`).join('')}</ul>`;
  const moving=MOVING.includes(s.status);
  return `<div>${m}<div class="legend"><span><i style="background:#2563eb"></i>Pickup</span><span><i style="background:#16a34a"></i>Drop-off</span><span><i style="background:#f59e0b"></i>Driver (simulated GPS)</span></div>${moving?`<div class="mt"><div class="row between sm"><b>Delivery progress</b><span><span data-prog="${s.id}">${Math.round(s.progress*100)}%</span> · ETA ~${etaMin(s)} min</span></div><div class="bar"><i data-progbar="${s.id}" style="width:${Math.round(s.progress*100)}%"></i></div></div>`:''}</div><div>${tl}</div>`}

const nextOpts=s=>{const out=[];(FLOW[s.status]||[]).forEach(t=>{if(t==='RESUME')out.push(['RESUME',`Resume (back to ${STATUS[resumeTarget(s)]})`]);else if(['assigned','picked_up','in_transit','out_for_delivery','delivered'].includes(t)&&!s.driverId)return;else if(t==='assigned')return;else out.push([t,t==='pending'?'Unassign (back to Pending)':STATUS[t]])});return out};

  const r=role(),cu=cust(s.customerId),d=s.driverId?drv(s.driverId):null,opts=nextOpts(s),inv=s.invoiceId?byId(DB.invoices,s.invoiceId):null;

  else{if(can('shipment.assign')&&['pending','assigned','picked_up'].includes(s.status))act+=`<button class="btn pri" data-act="assignmodal" data-id="${s.id}">${s.driverId?'Reassign driver':'Assign driver'}</button>`;if(can('shipment.status')&&opts.length)act+=`<span class="row"><select id="stsel">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select><button class="btn" data-act="chgstatus" data-id="${s.id}">Update status</button></span>`;if(can('payment.reconcile')&&s.payStatus==='pending_verification')act+=`<button class="btn ok" data-act="confirmbank" data-id="${s.id}">Confirm bank transfer</button>`}

  <div class="g2">${trackView(s)}</div>
  <div class="g2 mt"><div class="card flat"><h3 class="mb">Parties</h3><dl class="kvs"><dt>Customer</dt><dd>${esc(cu.name)} · ${esc(cu.phone)}</dd><dt>Pickup</dt><dd>${esc(s.pickup.label)}<br><span class="muted xs">${esc(s.pickup.line)} · ${esc(s.pickup.contact)} ${esc(s.pickup.phone)}</span></dd><dt>Drop-off</dt><dd>${esc(s.drop.label)}<br><span class="muted xs">${esc(s.drop.line)} · ${esc(s.drop.contact)} ${esc(s.drop.phone)}</span></dd><dt>Driver</dt><dd>${d?`${esc(drvName(d.id))} · ${esc(veh(s.vehicleId).plate)} (${veh(s.vehicleId).type})`:'<span class="muted">Not assigned</span>'}</dd>${s.scheduledAt?`<dt>Scheduled</dt><dd>${fdt(s.scheduledAt)}</dd>`:''}${s.failReason?`<dt>Issue</dt><dd class="err">${esc(s.failReason)}</dd>`:''}</dl><h3 class="mt mb">Items</h3>${s.items.map(i=>`<div class="sm">${i.qty}× ${esc(i.desc)} · ${i.weight} kg · ${i.l}×${i.w}×${i.h} cm</div>`).join('')}</div>
  <div class="card flat"><h3 class="mb">Price and payment</h3>${priceTable(s)}<div class="mt sm">${pay.length?pay.map(p=>`${mchip(p.method)} ${payBadge(p.status)} <span class="muted">${p.ref}${p.tx?' · tx '+p.tx.slice(0,10)+'…':''}</span>`).join('<br>'):'No payment record yet'}</div></div></div>
  ${s.pod?`<div class="card flat mt"><h3 class="mb">Proof of delivery</h3><div class="row" style="align-items:flex-start"><div><div class="sm">Received by <b>${esc(s.pod.receiver)}</b> (${esc(s.pod.rel||'Recipient')})</div><div class="xs muted">${fdt(s.pod.t)}</div></div>${s.pod.sig?`<img alt="Signature" src="${s.pod.sig}" style="height:70px;background:#fff;border:1px solid var(--line);border-radius:6px">`:'<span class="pill">Signature on file</span>'}${s.pod.photo?`<img alt="Delivery photo" src="${s.pod.photo}" style="height:70px;border-radius:6px">`:'<span class="pill">Photo on file</span>'}</div></div>`:''}`,{wide:true})}
function showInv(id){const i=byId(DB.invoices,id),s=shipById(i.shipId),cu=cust(i.customerId);modal('Invoice '+i.no,`<div class="print-area"><div class="row between"><div class="row"><div class="mark">${icon('truck',18)}</div><b style="font-size:17px">Nexus Logistics</b></div><div class="right"><div class="b">${i.no}</div><div class="muted sm">Issued ${fdate(i.t)}</div><span class="badge b-${i.status==='Paid'?'ok':'warn'}">${i.status}</span></div></div><div class="g2 mt mb"><div><div class="muted xs">BILL TO</div><div class="b">${esc(cu.name)}</div><div class="sm">${esc(cu.email)}<br>${esc(cu.phone)}</div></div><div><div class="muted xs">SHIPMENT</div><div class="b">${s.tracking}</div><div class="sm">${esc(s.pickup.label)} → ${esc(s.drop.label)}<br>${TYPES[s.type]} · ${s.km} km</div></div></div>${priceTable(s)}<p class="muted xs mt">Prototype invoice with sample data. Payment method: ${METHODS[s.method]}.</p></div><div class="mfoot no-print"><button class="btn" data-act="closeModal">Close</button><button class="btn pri" onclick="window.print()">${icon('download',14)} Print / Save PDF</button></div>`)}

function qrSVG(seedStr){let h=0;for(const c of seedStr)h=(h*31+c.charCodeAt(0))>>>0;const R=mulberry(h),n=25;let s=`<svg viewBox="0 0 ${n+2} ${n+2}" width="170" height="170" role="img" aria-label="Simulated QR code"><rect width="${n+2}" height="${n+2}" fill="#fff"/>`;for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);if(f){const ex=x<7?x:x-(n-7),ey=y<7?y:y-(n-7);if(ex===0||ex===6||ey===0||ey===6||(ex>1&&ex<5&&ey>1&&ey<5))s+=`<rect x="${x+1}" y="${y+1}" width="1" height="1" fill="#111"/>`}else if(R()>.52)s+=`<rect x="${x+1}" y="${y+1}" width="1" height="1" fill="#111"/>`}return s+'</svg>'}
ACT.paynow=d=>{const s=shipById(d.id);closeModal();startPay(s,s.method==='cod'?'card':s.method)};
function startPay(s,method){if(method==='cod'){createPayment(s,'cod',s.status==='delivered'?'cod_collected':'cod_pending');s.payStatus='cod_pending';save();toast('Cash on delivery selected');return paidModal(s,true)}
  if(method==='binance'||method==='bybit')return cryptoModal(s,method);return checkoutModal(s,method)}
function paidModal(s,cod){modal(cod?'Order placed':'Payment successful',`<div class="col" style="align-items:center;text-align:center"><div class="kic ok" style="width:60px;height:60px">${icon('check',30)}</div><h3>${cod?'Pay the driver on delivery':'Thank you, payment received'}</h3><div class="muted">Tracking number</div><div class="kv">${s.tracking}</div><div class="muted sm">${cod?'Amount due on delivery: ':'Amount: '}${money(s.price.total,s.currency)}</div><div class="row"><button class="btn pri" data-act="trackship" data-id="${s.id}">Track shipment</button><button class="btn" data-act="closeModal">Close</button></div></div>`)}
ACT.trackship=d=>{closeModal();location.hash='#/customer/shipments';setTimeout(()=>showShip(d.id),60)};
function cryptoModal(s,method){const g=DB.gateways[method];if(!g.on){toast(g.label+' is disabled by Super Admin','bad');return}
  let p=DB.payments.find(x=>x.shipId===s.id&&x.method===method&&x.status==='pending');if(!p)p=createPayment(s,method,'pending');s.payStatus='pending';save();
  const amt=r2(toUSD(s.price.total,s.currency)),addr=(method==='binance'?'0x':'T')+hex(36,mulberry(s.price.total|0)),T0=Date.now();
  modal(`${g.label} checkout <span class="chip ${method}">${g.label}</span>`,`${note('<b>Simulation only.</b> No real Binance or Bybit integration, wallet or funds are involved. Use the buttons below to simulate the customer paying.','info')}<div class="g2 mt"><div style="text-align:center">${qrSVG(p.ref+method)}<div class="xs muted mt">Scan with the ${g.label} app (simulated)</div></div><div><dl class="kvs"><dt>Order</dt><dd>${p.ref}</dd><dt>Shipment</dt><dd>${s.tracking}</dd><dt>Amount</dt><dd class="b">${amt} USDT <span class="muted">(≈ ${money(s.price.total,s.currency)})</span></dd><dt>Network</dt><dd>${method==='binance'?'BSC (BEP20)':'TRC20'} · simulated</dd><dt>Address</dt><dd class="xs" style="word-break:break-all">${addr}</dd><dt>Expires in</dt><dd><b id="cd">05:00</b></dd><dt>Status</dt><dd id="cst"><span class="badge b-warn">Waiting for payment…</span></dd></dl></div></div><div class="row mt"><label class="row sm"><input type="checkbox" id="auto"> Auto-confirm in 8 seconds</label></div><div class="mfoot"><button class="btn bad" data-act="cryptofail" data-id="${p.id}">Simulate failure</button><button class="btn" data-act="closeModal">Pay later</button><button class="btn ok" data-act="cryptook" data-id="${p.id}">Simulate: customer paid</button></div>`,{after:()=>{clearInterval(UI.payT);UI.payT=setInterval(()=>{const left=300-Math.floor((Date.now()-T0)/1000),el=$('#cd');if(!el){clearInterval(UI.payT);return}if($('#auto')&&$('#auto').checked&&Date.now()-T0>8000){ACT.cryptook({id:p.id});return}if(left<=0){clearInterval(UI.payT);p.status='expired';s.payStatus='unpaid';save();$('#cst').innerHTML='<span class="badge b-bad">Expired</span>';el.textContent='00:00';return}el.textContent=pad(Math.floor(left/60))+':'+pad(left%60)},500)}})}
ACT.cryptook=d=>{const p=byId(DB.payments,d.id),s=shipById(p.shipId);clearInterval(UI.payT);p.tx='0x'+hex(40);p.confirmations=12;markPaid(s,p);audit('Payment',`${METHODS[p.method]} confirmed ${p.ref}`);closeModal();toast(METHODS[p.method]+' payment confirmed (simulated)');render();paidModal(s)};

function initSig(){const c=$('#sig');if(!c)return;const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#0f172a';UI.sig={dirty:false};let dr=false;const P=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.onpointerdown=e=>{dr=true;c.setPointerCapture(e.pointerId);const[p,q]=P(e);x.beginPath();x.moveTo(p,q)};c.onpointermove=e=>{if(!dr)return;const[p,q]=P(e);x.lineTo(p,q);x.stroke();UI.sig.dirty=true};c.onpointerup=()=>{dr=false};
  $('#sigclr').onclick=()=>{x.clearRect(0,0,w,h);UI.sig.dirty=false}}
function samplePhoto(){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220"><rect width="320" height="220" fill="#dbe7f5"/><rect y="150" width="320" height="70" fill="#9aa9bd"/><rect x="40" y="30" width="90" height="120" fill="#6b7a90"/><rect x="170" y="100" width="90" height="62" fill="#c8944f"/><path d="M170 100h90l-12-16h-66z" fill="#dba865"/><text x="160" y="205" font-size="12" text-anchor="middle" fill="#2b3648" font-family="sans-serif">Sample delivery photo (simulated)</text></svg>`;return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg)}
function podModal(id){const s=shipById(id),cod=s.method==='cod'&&s.payStatus!=='cod_collected';UI.photo=null;
  modal('Proof of delivery · '+s.tracking,`<form data-submit="pod" data-id="${s.id}" class="col"><label class="f">Receiver name<input name="receiver" required value="${esc(s.drop.contact)}"></label><label class="f">Relationship<select name="rel"><option>Recipient</option><option>Family member</option><option>Security / reception</option><option>Neighbour</option></select></label><div><div class="row between"><b class="sm">Signature</b><button type="button" class="btn sm" id="sigclr">Clear</button></div><canvas id="sig" class="sig" aria-label="Signature pad"></canvas></div><div><b class="sm">Photo evidence</b><div class="row mt"><input type="file" accept="image/*" id="photoin" style="max-width:220px"><button type="button" class="btn sm" data-act="samplephoto">Use sample photo</button></div><img id="photoprev" alt="" style="display:none;height:80px;border-radius:6px;margin-top:8px"></div>${cod?`<label class="opt"><input type="checkbox" name="cod" required><div><b>Cash collected: ${money(s.price.total,s.currency)}</b><div class="xs muted">Confirm you collected the exact COD amount from the receiver.</div></div></label>`:''}<div class="mfoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn ok">Confirm delivery</button></div></form>`,{after:()=>{initSig();$('#photoin').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{UI.photo=r.result;const im=$('#photoprev');im.src=r.result;im.style.display='block'};r.readAsDataURL(f)}}})}

  const spend=sum(ms.filter(s=>['paid','cod_collected'].includes(s.payStatus)),s=>s.price.total/DB.fx[s.currency]*DB.fx[cur]);

/* wizard */
function wizInit(){const u=me();const en=Object.keys(DB.gateways).filter(k=>DB.gateways[k].on);return{step:1,city:u.city,ps:'',ds:'',pc:u.name,pp:u.phone,pl:'',dc:'',dp:'',dl:'',items:[{desc:'',qty:1,weight:1,l:20,w:20,h:15}],type:'standard',sched:new Date(Date.now()+DAY).toISOString().slice(0,16),method:en.includes('card')?'card':en[0]||'cod',notes:''}}
function resolveSel(v,w,side){if(!v)return null;const u=me();let b;if(v[0]==='a'){const a=byId(DB.addresses,v.slice(2));b={label:`${a.label} · ${city(a.city).zones[a.zone]}`,line:a.line,x:a.x,y:a.y,zone:a.zone,contact:a.contact,phone:a.phone}}else{b=mkLoc(w.city,+v.slice(2))}
  return {...b,line:w[side+'l']||b.line,contact:w[side+'c']||b.contact,phone:w[side+'p']||b.phone}}
const locOpts=(w,sel)=>{const u=me(),mine=DB.addresses.filter(a=>a.userId===u.id&&a.city===w.city);return `<option value="">Select a location…</option>${mine.length?`<optgroup label="Saved addresses">${mine.map(a=>`<option value="a:${a.id}" ${sel==='a:'+a.id?'selected':''}>${esc(a.label)} - ${esc(a.line)}</option>`).join('')}</optgroup>`:''}<optgroup label="Search locations (simulated geocoding)">${LM.map((l,i)=>`<option value="l:${i}" ${sel==='l:'+i?'selected':''}>${esc(lmLabel(w.city,i))}</option>`).join('')}</optgroup>`};
function quoteTable(q){return `<table class="t"><tbody><tr><td>Base fee</td><td class="right">${money(q.base,q.cur)}</td></tr><tr><td>Distance · ${q.km} km</td><td class="right">${money(q.distFee,q.cur)}</td></tr><tr><td>Weight · ${q.wt} kg chargeable</td><td class="right">${money(q.wtFee,q.cur)}</td></tr><tr><td>Service multiplier ×${q.mult}${q.minApplied?' (minimum fee)':''}</td><td class="right">${money(q.sub-q.base-q.distFee-q.wtFee,q.cur)}</td></tr><tr><td>Zone surcharge · ${q.hops} hop${q.hops===1?'':'s'}</td><td class="right">${money(q.zoneFee,q.cur)}</td></tr><tr><td>Tax</td><td class="right">${money(q.tax,q.cur)}</td></tr><tr><td class="b">Total</td><td class="right b" style="font-size:16px">${money(q.total,q.cur)}</td></tr></tbody></table>`}
PAGES.customer.newship=()=>{if(!UI.wiz)UI.wiz=wizInit();const w=UI.wiz,u=me(),c=city(w.city);const pk=resolveSel(w.ps,w,'p'),dr=resolveSel(w.ds,w,'d');

const SAMPLE_CSV=c=>{const L=i=>lmLabel(c,i);return `pickup_location,delivery_location,description,weight_kg,type,receiver_name,receiver_phone\n${L(0)},${L(5)},Clothing parcel,3.5,standard,Ada Bello,+000 700 111 001\n${L(1)},${L(8)},Spare parts,12,express,Musa Kariuki,+000 700 111 002\n${L(2)},${L(9)},Documents,0.4,same_day,Zawadi Otieno,+000 700 111 003\n${L(3)},Unknown Place,Books carton,6,standard,Kofi Mensah,+000 700 111 004\n${L(4)},${L(10)},Electronics box,-2,express,Lerato Dlamini,+000 700 111 005\n${L(6)},${L(11)},Groceries crate,9,scheduled,Tunde Adeyemi,+000 700 111 006`};
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}
function validateBulk(text){const c=me().city,labels=LM.map((l,i)=>lmLabel(c,i)),rows=parseCSV(text),hd=rows.shift()||[],ix=k=>hd.map(x=>x.trim().toLowerCase()).indexOf(k);
  return rows.slice(0,5000).map((r,n)=>{const g=k=>(r[ix(k)]||'').trim(),e=[],pi=labels.findIndex(l=>l.toLowerCase()===g('pickup_location').toLowerCase()),di=labels.findIndex(l=>l.toLowerCase()===g('delivery_location').toLowerCase()),wt=parseFloat(g('weight_kg'));
    if(pi<0)e.push('Unknown pickup location');if(di<0)e.push('Unknown delivery location');if(pi>=0&&pi===di)e.push('Pickup equals delivery');if(!(wt>0&&wt<=1000))e.push('Weight must be 0-1000 kg');if(!TYPES[g('type')])e.push('Type must be standard, express, same_day or scheduled');if(!g('receiver_name'))e.push('Receiver name required');if(!g('description'))e.push('Description required');
    return{id:'b'+n,row:n+2,pi,di,desc:g('description'),wt,type:g('type'),rn:g('receiver_name'),rp:g('receiver_phone'),errs:e}})}

/* ================= DISPATCHER (also used by admin) ================= */
const age=t=>{const m=Math.round((Date.now()-t)/MIN);return m<60?m+' m':Math.round(m/60)+' h'};
const driversScoped=()=>{const c=SCOPECITY();return DB.drivers.filter(d=>c==='ALL'||d.city===c)};
const shipRow=(extra=[])=>[{h:'Tracking',f:r=>`<b>${r.tracking}</b><div class="xs muted">${city(r.city).name}</div>`,sort:r=>r.tracking},{h:'Customer',f:r=>esc(cust(r.customerId).name),sort:r=>cust(r.customerId).name},{h:'Route',f:r=>`${esc(r.pickup.label)}<br><span class="xs muted">→ ${esc(r.drop.label)}</span>`},{h:'Type',f:r=>`<span class="pill">${TYPES[r.type]}</span>`,sort:r=>r.type},{h:'Status',f:r=>badge(r.status),sort:r=>r.status},{h:'Driver',f:r=>r.driverId?esc(drvName(r.driverId)):'<span class="muted">-</span>'},{h:'Payment',f:r=>payBadge(r.payStatus)},{h:'Age',f:r=>age(r.created),sort:r=>-r.created},...extra];
const assignBtn=r=>can('shipment.assign')&&['pending','assigned','picked_up'].includes(r.status)?`<button class="btn sm ${r.status==='pending'?'pri':''}" data-act="assignmodal" data-id="${r.id}">${r.status==='pending'?'Assign':'Reassign'}</button>`:'';
const shipFilters=()=>[{k:'s',label:'Status',opts:Object.entries(STATUS),fn:(r,v)=>r.status===v},{k:'t',label:'Type',opts:Object.entries(TYPES),fn:(r,v)=>r.type===v},{k:'d',label:'Driver',opts:[['none','Unassigned'],...DB.drivers.map(d=>[d.id,drvName(d.id)])],fn:(r,v)=>v==='none'?!r.driverId:r.driverId===v},{k:'p',label:'Payment',opts:Object.entries(PAYL).map(([k,v])=>[k,v[0]]),fn:(r,v)=>r.payStatus===v}];
function liveMapHTML(cityId,o={}){const ships=DB.shipments.filter(s=>s.city===cityId&&(MOVING.includes(s.status)||(o.all&&ACTIVE.includes(s.status)))),ds=DB.drivers.filter(d=>d.city===cityId),wh=DB.warehouses.filter(w=>w.city===cityId).map(w=>({x:w.x,y:w.y,name:w.name}));
  const markers=[];ships.forEach(s=>{markers.push({k:'t:'+s.id,x:s.drop.x,y:s.drop.y,color:'#16a34a',txt:'D',r:9,title:'Drop-off '+s.tracking,act:'mapsel',id:'s:'+s.id})});ds.forEach(d=>markers.push(driverMarker(d,{act:'mapsel',id:'d:'+d.id})));
  return mapSVG(cityId,{id:'livemap',wh,markers,paths:ships.flatMap(s=>[{pts:pathStr(pathPts(s)),color:'#94a3b8',dash:true,w:3,op:.7},{pts:trackPts(s),color:'#2563eb',trk:s.id,w:4}])})}
function mapPanelHTML(){const sel=UI.mapSel;if(!sel)return '<div class="empty">Click a driver or drop-off marker on the map for details.</div>';const [k,id]=sel.split(':');
  if(k==='d'){const d=drv(id);const jobs=DB.shipments.filter(s=>s.driverId===d.id&&OPENS.includes(s.status));return `<h3>${esc(drvName(d.id))}</h3><div class="muted sm mb">${veh(d.vehicleId).plate} · ${veh(d.vehicleId).type} · battery ${d.battery}% ${d.locked?'· <span class="err">screen locked</span>':''}</div>${jobs.map(s=>`<div class="card flat mb"><div class="row between"><b>${s.tracking}</b>${badge(s.status)}</div><div class="xs muted">${esc(s.pickup.label)} → ${esc(s.drop.label)}</div>${MOVING.includes(s.status)?`<div class="bar mt"><i data-progbar="${s.id}" style="width:${Math.round(s.progress*100)}%"></i></div>`:''}<button class="btn sm mt" data-act="openship" data-id="${s.id}">Details</button></div>`).join('')||'<div class="muted sm">No open jobs.</div>'}`}
  const s=shipById(id);return `<h3>${s.tracking}</h3><div class="mb">${badge(s.status)}</div><div class="sm">${esc(s.pickup.label)} → ${esc(s.drop.label)}<br>Driver: ${esc(drvName(s.driverId))}</div><button class="btn sm mt" data-act="openship" data-id="${s.id}">Details</button>`}
ACT.mapsel=d=>{UI.mapSel=d.id;const p=$('#mapPanel');if(p)p.innerHTML=mapPanelHTML()};
ACT.speed=d=>{UI.speed=+d.v;UI.paused=false;render()};ACT.pause=()=>{UI.paused=!UI.paused;render()};
const simCtl=()=>`<div class="row"><span class="muted sm">GPS simulation:</span><button class="btn sm" data-act="pause">${UI.paused?'▶ Resume':'⏸ Pause'}</button>${[1,2,4].map(v=>`<button class="btn sm ${UI.speed===v&&!UI.paused?'pri':''}" data-act="speed" data-v="${v}">×${v}</button>`).join('')}</div>`;
PAGES.dispatcher.dashboard=()=>{const ss=scoped(),un=ss.filter(s=>s.status==='pending'),act=ss.filter(s=>ACTIVE.includes(s.status)),ex=ss.filter(s=>['on_hold','delivery_failed'].includes(s.status)),ds=driversScoped(),c=SCOPECITY()==='ALL'?'LOS':SCOPECITY();
  return `${pageHead('Dispatch dashboard',city(c).name+' operations',simCtl())}<div class="g4 mb">${kpi('Unassigned orders',un.length,'need a driver','box',un.length?'warn':'ok')}${kpi('Active deliveries',act.length,'assigned to in transit','truck')}${kpi('Exceptions',ex.length,'on hold or failed','alert',ex.length?'bad':'ok')}${kpi('Drivers available',ds.filter(d=>d.status==='available').length+' / '+ds.length,'online now','users','ok')}</div><div class="g21"><div class="col">${card('Live map',liveMapHTML(c)+`<div class="legend"><span><i style="background:#16a34a"></i>Available</span><span><i style="background:#f59e0b"></i>On job</span><span><i style="background:#94a3b8"></i>Offline</span></div>`,`<a class="btn sm" href="#/dispatcher/map">Full map</a>`)}${card('Unassigned queue',table('dun',{cols:[{h:'Tracking',f:r=>`<b>${r.tracking}</b>`},{h:'Route',f:r=>esc(r.pickup.label)+' → '+esc(r.drop.label)},{h:'Type',f:r=>TYPES[r.type]},{h:'Age',f:r=>age(r.created)},{h:'',f:assignBtn,cls:'right'}],rows:()=>scoped().filter(s=>s.status==='pending'),rowAct:'openship',search:false,pageSize:5,empty:'All orders are assigned. 🎉'}))}</div><div class="col">${card('Exceptions',ex.length?ex.slice(0,5).map(s=>`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)"><div><b>${s.tracking}</b> ${badge(s.status)}<div class="xs muted">${esc(s.failReason||s.history[s.history.length-1].note||'')}</div></div><a class="btn sm" href="#/dispatcher/exceptions">Resolve</a></div>`).join(''):'<div class="empty">No exceptions</div>')}${card('Driver status',ds.map(d=>`<div class="row between" style="padding:6px 0"><span>${esc(drvName(d.id))} <span class="xs muted">${veh(d.vehicleId).type}</span></span><span class="badge b-${d.status==='available'?'ok':d.status==='on_job'?'warn':'muted'}">${d.status.replace('_',' ')}</span></div>`).join(''))}</div></div>`};
PAGES.dispatcher.orders=()=>`${pageHead('Orders','All shipments in your city. Click a row for details.')}${card('',table('ord',{cols:[...shipRow([{h:'',f:assignBtn,cls:'right'}])],rows:scoped,rowAct:'openship',csv:'orders',filters:shipFilters(),text:r=>[r.tracking,cust(r.customerId).name,r.pickup.label,r.drop.label,drvName(r.driverId)].join(' ')}))}`;
function mapPage(){const c=SCOPECITY()==='ALL'?(UI.mapCity||'LOS'):SCOPECITY();return `${pageHead('Live tracking map',city(c).name+' · simulated GPS positions update every second',simCtl())}${SCOPECITY()==='ALL'?`<div class="mb"><select data-chg="mapcity" style="width:auto">${DB.cities.map(x=>`<option value="${x.id}" ${x.id===c?'selected':''}>${x.name}</option>`).join('')}</select></div>`:''}<div class="g21"><div class="card">${liveMapHTML(c,{all:true})}<div class="legend"><span><i style="background:#16a34a"></i>Available / drop-off</span><span><i style="background:#f59e0b"></i>Driver on job</span><span><i style="background:#94a3b8"></i>Offline</span><span><i style="background:#475569"></i>Warehouse</span></div></div><div class="card" id="mapPanel">${mapPanelHTML()}</div></div>`}
CHG.mapcity=v=>{UI.mapCity=v;render()};
PAGES.dispatcher.map=mapPage;PAGES.admin.map=mapPage;
/* routes */
const routeKm=ids=>{let cur=null,t=0;ids.forEach(id=>{const s=shipById(id);if(cur)t+=km(cur,s.pickup);t+=km(s.pickup,s.drop);cur=s.drop});return r2(t)};
PAGES.dispatcher.routes=()=>{const c=SCOPECITY();return `${pageHead('Routes','Group assigned shipments into a driver run and set the stop order.',can('route.manage')?`<button class="btn pri" data-act="routenew">${icon('plus',15)} New route</button>`:'')}${note('Automatic route optimization is a Phase 2 feature. Stops are ordered manually in this release.','info')}<div class="mt">${card('',table('rts',{cols:[{h:'Route',f:r=>`<b>${r.id.toUpperCase()}</b>`},{h:'Driver',f:r=>esc(drvName(r.driverId))},{h:'Stops',f:r=>r.stops.map(id=>shipById(id).tracking).join(' → ')},{h:'Distance',f:r=>r.km+' km',cls:'right'},{h:'Status',f:r=>`<span class="badge b-${r.status==='done'?'ok':r.status==='active'?'info':'warn'}">${r.status}</span>`},{h:'',f:r=>`${r.status==='planned'?`<button class="btn sm" data-act="routestart" data-id="${r.id}">Start</button> `:''}${r.status==='active'?`<button class="btn sm ok" data-act="routedone" data-id="${r.id}">Complete</button> `:''}<button class="btn sm bad" data-act="routedel" data-id="${r.id}">Delete</button>`,cls:'right'}],rows:()=>DB.routes.filter(r=>c==='ALL'||drv(r.driverId).city===c),search:false,empty:'No routes yet. Create one from assigned shipments.'}))}</div>`};
PAGES.admin.routes=PAGES.dispatcher.routes;
function routeModal(){const D=UI.rd,ds=driversScoped(),drvId=D.driver||(ds[0]&&ds[0].id);D.driver=drvId;const pool=DB.shipments.filter(s=>s.driverId===drvId&&['assigned','picked_up'].includes(s.status)&&!s.routeId&&!D.stops.includes(s.id));
  modal('New route',`<label class="f">Driver<select data-chg="routedrv">${ds.map(d=>`<option value="${d.id}" ${d.id===drvId?'selected':''}>${esc(drvName(d.id))} (${city(d.city).name})</option>`).join('')}</select></label><div class="g2 mt"><div><h3 class="mb">Available shipments</h3>${pool.map(s=>`<div class="row between card flat mb"><div><b>${s.tracking}</b><div class="xs muted">${esc(s.pickup.label)} → ${esc(s.drop.label)}</div></div><button class="btn sm" data-act="rtadd" data-id="${s.id}">Add</button></div>`).join('')||'<div class="muted sm">No unrouted assigned shipments for this driver.</div>'}</div><div><h3 class="mb">Stop order (${routeKm(D.stops)} km)</h3>${D.stops.map((id,i)=>`<div class="row between card flat mb"><div><b>${i+1}. ${shipById(id).tracking}</b><div class="xs muted">${esc(shipById(id).drop.label)}</div></div><div class="row"><button class="btn sm" data-act="rtup" data-i="${i}">↑</button><button class="btn sm" data-act="rtdn" data-i="${i}">↓</button><button class="btn sm bad" data-act="rtrm" data-i="${i}">✕</button></div></div>`).join('')||'<div class="muted sm">Add shipments to build the route.</div>'}</div></div><div class="mfoot"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="rtsave" ${D.stops.length?'':'disabled'}>Save route</button></div>`,{wide:true})}
ACT.routenew=()=>{UI.rd={driver:null,stops:[]};routeModal()};CHG.routedrv=v=>{UI.rd.driver=v;UI.rd.stops=[];routeModal()};
ACT.rtadd=d=>{UI.rd.stops.push(d.id);routeModal()};ACT.rtrm=d=>{UI.rd.stops.splice(+d.i,1);routeModal()};ACT.rtup=d=>{const s=UI.rd.stops,i=+d.i;if(i>0){[s[i-1],s[i]]=[s[i],s[i-1]]}routeModal()};ACT.rtdn=d=>{const s=UI.rd.stops,i=+d.i;if(i<s.length-1){[s[i+1],s[i]]=[s[i],s[i+1]]}routeModal()};
ACT.rtsave=()=>{const D=UI.rd,r={id:'r'+(DB.seq.route++),driverId:D.driver,date:Date.now(),status:'planned',stops:[...D.stops],km:routeKm(D.stops)};DB.routes.push(r);D.stops.forEach(id=>shipById(id).routeId=r.id);audit('Route','Created '+r.id.toUpperCase());notify(drv(r.driverId).userId,`New route ${r.id.toUpperCase()} with ${r.stops.length} stops`);save();closeModal();toast('Route saved');render()};
ACT.routestart=d=>{byId(DB.routes,d.id).status='active';save();toast('Route started');render()};ACT.routedone=d=>{byId(DB.routes,d.id).status='done';save();toast('Route completed');render()};
ACT.routedel=d=>{const r=byId(DB.routes,d.id);r.stops.forEach(id=>{const s=shipById(id);if(s)s.routeId=null});DB.routes=DB.routes.filter(x=>x.id!==d.id);save();toast('Route deleted');render()};
/* exceptions */
PAGES.dispatcher.exceptions=()=>{const rows=()=>scoped().filter(s=>['on_hold','delivery_failed'].includes(s.status)||(s.status==='pending'&&Date.now()-s.created>30*MIN)||(MOVING.includes(s.status)&&s.arrived&&Date.now()-(s.history[s.history.length-1].t)>HOUR*4));
  const issue=s=>s.status==='pending'?'Unassigned for '+age(s.created):s.status==='on_hold'?'On hold: '+(s.history[s.history.length-1].note||'no reason'):s.status==='delivery_failed'?'Failed: '+(s.failReason||s.history[s.history.length-1].note):'Driver arrived, not confirmed';
  return `${pageHead('Exceptions','Orders that need a decision.')}${card('',table('exc',{cols:[{h:'Tracking',f:r=>`<b>${r.tracking}</b>`},{h:'Issue',f:r=>esc(issue(r))},{h:'Status',f:r=>badge(r.status)},{h:'Driver',f:r=>esc(drvName(r.driverId))},{h:'Customer',f:r=>esc(cust(r.customerId).name)},{h:'Actions',f:r=>`<div class="row">${r.status==='pending'?assignBtn(r):''}${r.status==='on_hold'?`<button class="btn sm ok" data-act="exresume" data-id="${r.id}">Resume</button>`:''}${r.status==='delivery_failed'?`<button class="btn sm" data-act="exretry" data-id="${r.id}">Reattempt</button><button class="btn sm bad" data-act="exreturn" data-id="${r.id}">Return to sender</button>`:''}<button class="btn sm bad" data-act="excancel" data-id="${r.id}">Cancel</button></div>`}],rows,rowAct:'openship',empty:'No exceptions. Everything is flowing.'}))}`};
ACT.exresume=d=>{const s=shipById(d.id);setStatus(s,resumeTarget(s),me().name,'Resumed by dispatch');toast('Shipment resumed');render()};
ACT.exretry=d=>{const s=shipById(d.id);s.progress=0;s.arrived=false;s.track=[];setStatus(s,'out_for_delivery',me().name,'Reattempt scheduled');s.gps=true;toast('Reattempt started');render()};
ACT.exreturn=d=>{const s=shipById(d.id);setStatus(s,'returned',me().name,'Returned to sender');toast('Marked as returned','warn');render()};
ACT.excancel=d=>askReason('Cancel shipment',r=>{const s=shipById(d.id);setStatus(s,'cancelled',me().name,r);toast('Shipment cancelled','warn');render()},['Customer request','Undeliverable address','Duplicate order','Other']);
PAGES.dispatcher.drivers=()=>`${pageHead('Driver board')}${card('',table('drvb',{cols:[{h:'Driver',f:r=>`<b>${esc(drvName(r.id))}</b><div class="xs muted">${city(r.city).name}</div>`,sort:r=>drvName(r.id)},{h:'Vehicle',f:r=>`${veh(r.vehicleId).plate}<div class="xs muted">${veh(r.vehicleId).type} · ${veh(r.vehicleId).capKg} kg</div>`},{h:'Status',f:r=>`<span class="badge b-${r.status==='available'?'ok':r.status==='on_job'?'warn':'muted'}">${r.status.replace('_',' ')}</span>`,sort:r=>r.status},{h:'Open jobs',f:r=>DB.shipments.filter(s=>s.driverId===r.id&&OPENS.includes(s.status)).length,sort:r=>DB.shipments.filter(s=>s.driverId===r.id&&OPENS.includes(s.status)).length},{h:'Rating',f:r=>'★ '+r.rating,sort:r=>r.rating},{h:'Battery',f:r=>r.battery+'%'},{h:'',f:r=>`<button class="btn sm" data-act="locate" data-id="${r.id}">Locate</button>`,cls:'right'}],rows:driversScoped,pageSize:10}))}`;
ACT.locate=d=>{UI.mapSel='d:'+d.id;const r=role()==='admin'||role()==='superadmin'?role():'dispatcher';if(r!=='dispatcher')UI.mapCity=drv(d.id).city;location.hash='#/'+r+'/map'};

/* ================= DRIVER (mobile PWA) ================= */
const MYJOBS=()=>DB.shipments.filter(s=>s.driverId===myDriver().id);
PAGES.driver.jobs=()=>{const d=myDriver(),jobs=MYJOBS().filter(s=>OPENS.includes(s.status)).sort((a,b)=>ACTIVE.indexOf(b.status)-ACTIVE.indexOf(a.status)),doneToday=MYJOBS().filter(s=>s.status==='delivered'&&Date.now()-s.history[s.history.length-1].t<DAY).length;
  return `<div class="card row between"><div><div class="muted xs">Status</div><b>${d.online?(d.status==='on_job'?'On job':'Online · available'):'Offline'}</b></div><label class="sw"><input type="checkbox" ${d.online?'checked':''} data-chg="online"><span></span></label></div><div class="g2" style="gap:10px"><div class="card kpi"><div><div class="muted xs">Open jobs</div><div class="kv">${jobs.length}</div></div></div><div class="card kpi"><div><div class="muted xs">Delivered (24h)</div><div class="kv">${doneToday}</div></div></div></div>${d.locked&&!DB.settings.capacitorBg?note('GPS paused: screen is locked and this PWA cannot track in the background.'):''}${jobs.map(s=>`<a class="card" href="#/driver/job/${s.id}" style="color:inherit;display:block"><div class="row between"><b>${s.tracking}</b>${badge(s.status)}</div><div class="sm mt">${icon('pin',13)} ${esc(s.pickup.label)}<br>${icon('nav',13)} ${esc(s.drop.label)}</div><div class="row mt"><span class="pill">${TYPES[s.type]}</span>${s.method==='cod'&&s.payStatus!=='cod_collected'?`<span class="badge b-warn">COD ${money(s.price.total,s.currency)}</span>`:''}${s.status==='assigned'&&!s.accepted?'<span class="badge b-info">New</span>':''}</div></a>`).join('')||`<div class="card empty">${d.online?'No jobs assigned yet. Waiting for dispatch…':'You are offline. Go online to receive jobs.'}</div>`}`};
CHG.online=v=>{const d=myDriver();d.online=v;if(d.status!=='on_job')d.status=v?'available':'offline';save();toast(v?'You are online':'You are offline');render()};
PAGES.driver.job=(arg)=>{const s=shipById(arg),d=myDriver();if(!s||s.driverId!==d.id)return '<div class="card empty">Job not found or not assigned to you.</div>';
  const cod=s.method==='cod'&&s.payStatus!=='cod_collected';let acts='';
  if(s.status==='assigned'&&!s.accepted)acts=`<button class="btn ok block" data-act="drvaccept" data-id="${s.id}">Accept job</button><button class="btn bad block" data-act="drvreject" data-id="${s.id}">Reject</button>`;
  else if(s.status==='assigned')acts=`<button class="btn pri block" data-act="drvpickup" data-id="${s.id}">Confirm pickup</button>`;
  else if(s.status==='picked_up')acts=`<button class="btn pri block" data-act="drvstart" data-id="${s.id}">Start trip (share GPS)</button>`;
  else if(s.status==='in_transit')acts=`<button class="btn pri block" data-act="drvofd" data-id="${s.id}">Out for delivery</button>`;
  else if(s.status==='out_for_delivery')acts=`${can('pod.create')?`<button class="btn ok block" data-act="drvdeliver" data-id="${s.id}">Deliver and capture proof</button>`:''}<button class="btn bad block" data-act="drvfail" data-id="${s.id}">Delivery failed</button>`;
  else if(s.status==='on_hold')acts=note('This job is on hold by dispatch.');else if(s.status==='delivery_failed')acts=note('Waiting for the dispatcher to reattempt or return.');
  const markers=[{k:'p',x:s.pickup.x,y:s.pickup.y,color:'#2563eb',txt:'P',title:'Pickup'},{k:'t',x:s.drop.x,y:s.drop.y,color:'#16a34a',txt:'D',title:'Drop-off'},driverMarker(d)];
  return `<a href="#/driver/jobs" class="sm">← All jobs</a><div class="card"><div class="row between"><h3>${s.tracking}</h3>${badge(s.status)}</div><div class="row mt"><span class="pill">${TYPES[s.type]}</span><span class="pill">${s.weight} kg</span><span class="pill">${s.km} km</span>${cod?`<span class="badge b-warn">Collect ${money(s.price.total,s.currency)}</span>`:payBadge(s.payStatus)}</div></div>
