ACT.vehmaint=d=>{const v=byId(DB.vehicles,d.id);modal('Maintenance · '+v.plate,`<div class="row between mb"><span>Status: <span class="badge b-${v.status==='active'?'ok':'warn'}">${v.status}</span></span><button class="btn sm" data-act="vehstatus" data-id="${v.id}">${v.status==='active'?'Send to maintenance':'Return to service'}</button></div><div class="tw mb"><table class="t"><thead><tr><th>Date</th><th>Type</th><th>Cost</th><th>Notes</th><th>Next due</th></tr></thead><tbody>${[...v.maint].reverse().map(m=>`<tr><td>${fdate(m.t)}</td><td>${esc(m.type)}</td><td>${money(m.cost,city(v.city).cur)}</td><td>${esc(m.notes)}</td><td>${m.next?fdate(m.next):'-'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No records</td></tr>'}</tbody></table></div><h3 class="mb">Log a service</h3><form data-submit="maint" data-id="${v.id}" class="fgrid"><label class="f">Service type<input name="type" required placeholder="e.g. Oil change"></label><label class="f">Cost (${city(v.city).cur})<input type="number" name="cost" min="0" required></label><label class="f full">Notes<input name="notes"></label><label class="f">Next due in (days)<input type="number" name="next" value="60"></label><div class="full mfoot"><button class="btn pri">Add record</button></div></form>`,{wide:true})};
SUB.maint=(fd,d)=>{const v=byId(DB.vehicles,d.id);v.maint.push({t:Date.now(),type:fd.type,cost:+fd.cost,notes:fd.notes,next:Date.now()+(+fd.next)*DAY});audit('Vehicle','Service logged for '+v.plate);save();toast('Maintenance logged');ACT.vehmaint({id:v.id});render()};
ACT.vehstatus=d=>{const v=byId(DB.vehicles,d.id);v.status=v.status==='active'?'maintenance':'active';audit('Vehicle',v.plate+' '+v.status);save();toast(v.plate+' is '+v.status);ACT.vehmaint({id:v.id});render()};
/* pricing */
PAGES.admin.pricing=()=>{const pc=UI.tab.pricity||'LOS',c=city(pc),R=DB.rules[pc],edit=can('pricing.manage'),S=UI.sim=UI.sim||{from:0,to:5,w:3,type:'standard',l:30,wd:20,h:15};
  const pk=mkLoc(pc,S.from),dr=mkLoc(pc,S.to),q=quote(pc,pk,dr,[{weight:S.w,qty:1,l:S.l,w:S.wd,h:S.h}],S.type),f=(k,l,v,step='any')=>`<label class="f">${l}<input type="number" step="${step}" min="0" name="${k}" value="${v}" ${edit?'':'disabled'} required></label>`;
  return `${pageHead('Pricing and zones','Distance, weight and zone pricing per city. Changes apply instantly to customer quotes.')}<div class="tabs">${DB.cities.map(x=>`<button class="${x.id===pc?'on':''}" data-act="pricity" data-id="${x.id}">${x.name} (${x.cur})</button>`).join('')}</div><div class="g2"><form class="card fgrid" data-submit="pricing" data-id="${pc}"><h3 class="full">Rate card · ${c.cur}</h3>${f('base','Base fee',R.base)}${f('perKm','Per km',R.perKm)}${f('perKg','Per kg',R.perKg)}${f('min','Minimum fee',R.min)}${f('zone','Zone hop surcharge',R.zone)}${f('tax','Tax rate (0.075 = 7.5%)',R.tax)}<h3 class="full mt">Service multipliers</h3>${Object.keys(TYPES).map(k=>f('m_'+k,TYPES[k],R.mult[k])).join('')}<div class="full">${edit?'<button class="btn pri">Save rate card</button>':'<span class="muted sm">You do not have permission to edit pricing.</span>'}</div></form><div class="card"><h3 class="mb">Price simulator</h3><div class="fgrid"><label class="f">From<select data-chg="sim" data-k="from">${LM.map((l,i)=>`<option value="${i}" ${S.from===i?'selected':''}>${esc(lmLabel(pc,i))}</option>`).join('')}</select></label><label class="f">To<select data-chg="sim" data-k="to">${LM.map((l,i)=>`<option value="${i}" ${S.to===i?'selected':''}>${esc(lmLabel(pc,i))}</option>`).join('')}</select></label><label class="f">Weight (kg)<input type="number" step="0.1" value="${S.w}" data-chg="sim" data-k="w"></label><label class="f">Service<select data-chg="sim" data-k="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${S.type===k?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="mt">${quoteTable(q)}</div></div></div><div class="card mt"><h3 class="mb">Zone surcharge matrix (${c.cur})</h3><div class="tw"><table class="t"><thead><tr><th>From \\ To</th>${c.zones.map(z=>`<th>${esc(z)}</th>`).join('')}</tr></thead><tbody>${c.zones.map((z,i)=>`<tr><td class="b">${esc(z)}</td>${c.zones.map((_,j)=>`<td>${money(zoneHops(i,j)*R.zone,c.cur)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`};
ACT.pricity=d=>{UI.tab.pricity=d.id;UI.sim=null;render()};
CHG.sim=(v,d)=>{UI.sim[d.k]=['from','to','w'].includes(d.k)?+v:v;render()};
SUB.pricing=(fd,d)=>{if(!can('pricing.manage'))return toast('Not permitted','bad');const R=DB.rules[d.id];['base','perKm','perKg','min','zone','tax'].forEach(k=>R[k]=+fd[k]);Object.keys(TYPES).forEach(k=>R.mult[k]=+fd['m_'+k]);audit('Pricing','Updated '+d.id+' rate card');save();toast('Rate card saved. Customer quotes updated.');render()};
/* payments */
PAGES.admin.payments=()=>{const ps=()=>DB.payments.filter(p=>{const s=shipById(p.shipId);return s&&(SCOPECITY()==='ALL'||s.city===SCOPECITY())}),held=ps().filter(p=>p.status==='cod_collected'&&!p.remitted),byDrv={};held.forEach(p=>{const d=shipById(p.shipId).driverId;(byDrv[d]=byDrv[d]||[]).push(p)});
  return `${pageHead('Payments','Transactions, gateway status and COD reconciliation.')}<div class="g4 mb">${kpi('Collected',usd(sum(ps().filter(p=>['paid','cod_collected'].includes(p.status)),p=>toUSD(p.amount,p.cur))),'all methods','dollar')}${kpi('Awaiting verification',ps().filter(p=>p.status==='pending_verification').length,'bank transfers','clock','warn')}${kpi('COD held by drivers',usd(sum(held,p=>toUSD(p.amount,p.cur))),held.length+' payments','wallet','warn')}${kpi('Failed / expired',ps().filter(p=>['failed','expired'].includes(p.status)).length,'','alert','bad')}</div>
  <div class="card mb"><div class="ch"><h3>Gateway status</h3></div><div class="row">${Object.entries(DB.gateways).map(([k,g])=>`<span class="badge b-${g.on?'ok':'muted'}">${g.label}: ${g.on?'enabled':'disabled'}</span>`).join('')}<span class="muted xs">Crypto gateways (Binance Pay, Bybit Pay) are simulated.</span></div></div>
  <div class="g21"><div>${card('All payments',table('apay',{cols:[{h:'Reference',f:r=>`<b>${r.ref}</b>`},{h:'Shipment',f:r=>shipById(r.shipId).tracking},{h:'Customer',f:r=>esc(cust(r.userId).name)},{h:'Method',f:r=>mchip(r.method)},{h:'Amount',f:r=>money(r.amount,r.cur)+(r.crypto?`<div class="xs muted">${r.crypto} ${r.asset}</div>`:''),cls:'right',sort:r=>toUSD(r.amount,r.cur)},{h:'Status',f:r=>payBadge(r.status)},{h:'Date',f:r=>fdt(r.t),sort:r=>r.t},{h:'',f:r=>`${r.status==='pending_verification'&&can('payment.reconcile')?`<button class="btn sm ok" data-act="confirmbank" data-id="${r.shipId}">Confirm</button> `:''}${r.status==='paid'&&can('payment.refund')?`<button class="btn sm bad" data-act="refund" data-id="${r.id}">Refund</button>`:''}`,cls:'right'}],rows:ps,csv:'payments',filters:[{k:'m',label:'Method',opts:Object.entries(METHODS),fn:(r,v)=>r.method===v},{k:'s',label:'Status',opts:Object.entries(PAYL).map(([k,v])=>[k,v[0]]),fn:(r,v)=>r.status===v}],text:r=>r.ref+r.method+cust(r.userId).name,pageSize:9}))}</div><div>${card('COD reconciliation',Object.keys(byDrv).length?Object.entries(byDrv).map(([did,list])=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${esc(drvName(did))}</b><div class="xs muted">${list.length} deliveries · ${usd(sum(list,p=>toUSD(p.amount,p.cur)))}</div></div>${can('payment.reconcile')?`<button class="btn sm ok" data-act="remit" data-id="${did}">Mark remitted</button>`:''}</div>`).join(''):'<div class="empty">All COD cash is reconciled.</div>')}</div></div>`};
ACT.refund=d=>confirmModal('Refund payment','Refund this payment to the customer (simulated)?','dorefund',d.id,'Refund');
ACT.dorefund=d=>{const p=byId(DB.payments,d.id),s=shipById(p.shipId);p.status='refunded';s.payStatus='refunded';notify(s.customerId,`Refund of ${money(p.amount,p.cur)} issued for ${s.tracking}`,s.id);audit('Payment','Refunded '+p.ref);save();closeModal();toast('Refund issued (simulated)');render()};
ACT.remit=d=>{DB.payments.filter(p=>p.status==='cod_collected'&&!p.remitted&&shipById(p.shipId).driverId===d.id).forEach(p=>p.remitted=true);audit('COD','Reconciled cash from '+drvName(d.id));save();toast('COD cash reconciled for '+drvName(d.id));render()};
/* warehouses */
PAGES.admin.warehouses=()=>{const c=SCOPECITY(),ws=DB.warehouses.filter(w=>c==='ALL'||w.city===c);
  return `${pageHead('Warehouses','Capacity, parcels on site and scanning.')}<div class="g3">${ws.map(w=>{const items=DB.inventory.filter(i=>i.wh===w.id),used=sum(items,i=>i.qty),pc=DB.shipments.filter(s=>s.warehouseId===w.id).length,pct=Math.round(used/w.cap*100);return `<div class="card"><div class="row between"><h3>${esc(w.name)}</h3><span class="pill">${city(w.city).name}</span></div><div class="muted sm">${esc(w.addr)}</div><div class="mt row between sm"><span>Stock units</span><b>${used.toLocaleString()} / ${w.cap.toLocaleString()}</b></div>${bar(pct,pct>85?'bad':pct>65?'warn':'')}<div class="row between sm mt"><span>Parcels on site</span><b>${pc}</b></div><div class="row mt"><button class="btn sm pri" data-act="whscan" data-id="${w.id}">Scan parcel</button><a class="btn sm" href="#/admin/inventory">Inventory</a></div></div>`}).join('')}</div>`};
ACT.whscan=d=>{const w=byId(DB.warehouses,d.id),here=DB.shipments.filter(s=>s.warehouseId===w.id);modal('Scan parcel · '+esc(w.name),`<form data-submit="scan" data-id="${w.id}" class="row mb"><input name="no" placeholder="Tracking number" style="max-width:240px" required><select name="dir" style="width:auto"><option value="in">Receive (scan in)</option><option value="out">Dispatch (scan out)</option></select><button class="btn pri">Scan</button></form><h3 class="mb">Parcels currently here (${here.length})</h3>${here.map(s=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span><b>${s.tracking}</b> ${badge(s.status)}</span><span class="xs muted">${esc(s.drop.label)}</span></div>`).join('')||'<div class="empty">No parcels on site. Scan one in.</div>'}`)};
SUB.scan=(fd,d)=>{const w=byId(DB.warehouses,d.id),s=DB.shipments.find(x=>x.tracking.toLowerCase()===fd.no.trim().toLowerCase());if(!s)return toast('Tracking number not found','bad');
  if(fd.dir==='in'){s.warehouseId=w.id;s.history.push({t:Date.now(),status:s.status,by:me().name,note:'Received at '+w.name})}else{if(s.warehouseId!==w.id)return toast('Parcel is not in this warehouse','bad');s.warehouseId=null;s.history.push({t:Date.now(),status:s.status,by:me().name,note:'Dispatched from '+w.name})}
  notify(s.customerId,`${s.tracking}: ${fd.dir==='in'?'received at':'left'} ${w.name}`,s.id);audit('Warehouse',`${fd.dir==='in'?'Scanned in':'Scanned out'} ${s.tracking}`);save();toast(`${s.tracking} scanned ${fd.dir}`);ACT.whscan({id:w.id});render()};
/* inventory */
PAGES.admin.inventory=()=>{const c=SCOPECITY(),inv=()=>DB.inventory.filter(i=>c==='ALL'||byId(DB.warehouses,i.wh).city===c);
  return `${pageHead('Inventory','Stock held in warehouses for business customers.',`<button class="btn pri" data-act="skuadd">${icon('plus',15)} Add SKU</button>`)}${inv().some(i=>i.qty<i.min)?note('Some SKUs are below their minimum stock level.'):''}<div class="mt">${card('Stock',table('inv',{cols:[{h:'SKU',f:r=>`<b>${r.sku}</b>`,sort:r=>r.sku},{h:'Item',f:r=>esc(r.name),sort:r=>r.name},{h:'Warehouse',f:r=>esc(byId(DB.warehouses,r.wh).name)},{h:'Owner',f:r=>r.org?esc(byId(DB.orgs,r.org).name):'<span class="muted">Nexus</span>'},{h:'On hand',f:r=>r.qty.toLocaleString(),cls:'right',sort:r=>r.qty},{h:'Min',f:r=>r.min,cls:'right'},{h:'Level',f:r=>r.qty<r.min?'<span class="badge b-bad">Low stock</span>':'<span class="badge b-ok">OK</span>'},{h:'',f:r=>`<button class="btn sm" data-act="skuadj" data-id="${r.id}">Adjust</button>`,cls:'right'}],rows:inv,csv:'inventory',filters:[{k:'w',label:'Warehouse',opts:DB.warehouses.map(w=>[w.id,w.name]),fn:(r,v)=>r.wh===v},{k:'l',label:'Level',opts:[['low','Low stock']],fn:r=>r.qty<r.min}],text:r=>r.sku+r.name}))}</div><div class="mt">${card('Recent movements',`<div class="tw"><table class="t"><thead><tr><th>Date</th><th>SKU</th><th>Change</th><th>Reason</th><th>By</th></tr></thead><tbody>${DB.moves.slice(0,10).map(m=>`<tr><td>${fdt(m.t)}</td><td>${byId(DB.inventory,m.item).sku}</td><td class="b" style="color:var(--${m.delta>0?'ok':'bad'})">${m.delta>0?'+':''}${m.delta}</td><td>${esc(m.reason)}</td><td>${esc(m.by)}</td></tr>`).join('')}</tbody></table></div>`)}</div>`};
ACT.skuadj=d=>{const i=byId(DB.inventory,d.id);modal('Adjust stock · '+i.sku,`<p>${esc(i.name)} · on hand <b>${i.qty}</b></p><form data-submit="adj" data-id="${i.id}" class="fgrid"><label class="f">Action<select name="dir"><option value="1">Receive stock</option><option value="-1">Issue stock</option></select></label><label class="f">Quantity<input type="number" name="q" min="1" required></label><label class="f full">Reason<input name="reason" required placeholder="e.g. Inbound PO-1234"></label><div class="full mfoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn pri">Apply</button></div></form>`)};
SUB.adj=(fd,d)=>{const i=byId(DB.inventory,d.id),delta=(+fd.dir)*(+fd.q);if(i.qty+delta<0)return toast('Not enough stock','bad');i.qty+=delta;DB.moves.unshift({t:Date.now(),item:i.id,delta,reason:fd.reason,by:me().name});audit('Inventory',`${i.sku} ${delta>0?'+':''}${delta}`);save();closeModal();toast('Stock updated');render()};
ACT.skuadd=()=>modal('Add SKU',`<form data-submit="sku" class="fgrid"><label class="f">SKU<input name="sku" required placeholder="SKU-4001"></label><label class="f">Name<input name="name" required></label><label class="f">Warehouse<select name="wh">${DB.warehouses.map(w=>`<option value="${w.id}">${w.name}</option>`).join('')}</select></label><label class="f">Owner<select name="org"><option value="">Nexus</option>${DB.orgs.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select></label><label class="f">Opening quantity<input type="number" name="qty" min="0" value="0"></label><label class="f">Minimum level<input type="number" name="min" min="0" value="50"></label><div class="full mfoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn pri">Add</button></div></form>`);
SUB.sku=fd=>{DB.inventory.push({id:'i'+(DB.inventory.length+20),sku:fd.sku,name:fd.name,wh:fd.wh,qty:+fd.qty,min:+fd.min,org:fd.org||null});audit('Inventory','Added '+fd.sku);save();closeModal();toast('SKU added');render()};

PAGES.admin.business=()=>`${pageHead('Business accounts','Companies with team members, credit terms and consolidated invoicing.',`<button class="btn pri" data-act="orgadd">${icon('plus',15)} Add business</button>`)}${note('Business accounts are a Phase 2 module, included here for design review.','info')}<div class="mt">${card('',table('org',{cols:[{h:'Business',f:r=>`<b>${esc(r.name)}</b><div class="xs muted">${city(r.city).name}</div>`,sort:r=>r.name},{h:'Plan',f:r=>r.plan},{h:'Members',f:r=>r.members.length},{h:'Credit used',f:r=>{const c=city(r.city).cur;return `<div class="sm">${money(r.used,c)} / ${money(r.credit,c)}</div>${bar(r.used/r.credit*100,r.used/r.credit>.8?'bad':'')}`},cls:'nowrap'},{h:'',f:r=>`<button class="btn sm" data-act="orgview" data-id="${r.id}">Open</button>`,cls:'right'}],rows:()=>DB.orgs,search:false}))}</div>`;
ACT.orgview=d=>{const o=byId(DB.orgs,d.id),c=city(o.city).cur,ids=o.members;modal(esc(o.name),`<div class="g3 mb">${kpi('Credit limit',money(o.credit,c),'','dollar')}${kpi('Used',money(o.used,c),Math.round(o.used/o.credit*100)+'%','wallet','warn')}${kpi('Shipments',DB.shipments.filter(s=>ids.includes(s.customerId)).length,'all time','box')}</div><h3 class="mb">Team members</h3>${o.members.map(id=>`<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(cust(id).name)}</span><span class="muted sm">${esc(cust(id).email)}</span></div>`).join('')}`)};
ACT.orgadd=()=>modal('Add business',`<form data-submit="org" class="fgrid"><label class="f">Company name<input name="name" required></label><label class="f">City<select name="city">${DB.cities.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></label><label class="f">Credit limit<input type="number" name="credit" value="100000" required></label><label class="f">Plan<select name="plan"><option>Pay per shipment</option><option>Monthly invoicing</option></select></label><div class="full mfoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn pri">Create</button></div></form>`);
SUB.org=fd=>{DB.orgs.push({id:'o'+(++DB.seq.org),name:fd.name,city:fd.city,credit:+fd.credit,used:0,members:[],plan:fd.plan});audit('Business','Created '+fd.name);save();closeModal();toast('Business account created');render()};
/* reports */
PAGES.admin.reports=()=>{const tab=UI.tab.rep||'delivery',n=UI.repDays||14,ss=scoped().filter(s=>s.created>=Date.now()-n*DAY),dl=dayLabels(Math.min(n,14)),sc=SCOPECITY();let body='';
  if(tab==='delivery'){const del=ss.filter(s=>s.status==='delivered'),st=Object.keys(STATUS).map(k=>({l:STATUS[k],v:ss.filter(s=>s.status===k).length})).filter(x=>x.v);body=`<div class="g4 mb">${kpi('Orders',ss.length,'last '+n+' days','box')}${kpi('Delivered',del.length,Math.round(del.length/(ss.length||1)*100)+'% of orders','check','ok')}${kpi('On-time rate',(del.length?Math.round(del.filter(onTime).length/del.length*100):0)+'%','vs service SLA','clock')}${kpi('Failed / returned',ss.filter(s=>['delivery_failed','returned'].includes(s.status)).length,'','alert','bad')}</div><div class="g2 mb">${card('Orders per day',barChart(dl.map(d=>({l:d.l,v:ss.filter(s=>new Date(s.created).toDateString()===d.t).length}))))}${card('By status',`<div class="row" style="justify-content:center">${donut(st.map((x,i)=>({...x,c:PAL[i%8]})),{center:ss.length})}</div>${legend(st.map((x,i)=>({...x,c:PAL[i%8]})))}`)}</div>${card('By city',`<div class="tw"><table class="t"><thead><tr><th>City</th><th>Orders</th><th>Delivered</th><th>Failed</th><th>On-time</th></tr></thead><tbody>${DB.cities.filter(c=>sc==='ALL'||c.id===sc).map(c=>{const l=ss.filter(s=>s.city===c.id),d=l.filter(s=>s.status==='delivered');return `<tr><td class="b">${c.name}</td><td>${l.length}</td><td>${d.length}</td><td>${l.filter(s=>['delivery_failed','returned'].includes(s.status)).length}</td><td>${d.length?Math.round(d.filter(onTime).length/d.length*100):0}%</td></tr>`}).join('')}</tbody></table></div>`)}`}
  if(tab==='revenue'){const byM=Object.keys(METHODS).map(k=>({l:METHODS[k],v:Math.round(revUSD(ss.filter(s=>s.method===k)))})).filter(x=>x.v),byT=Object.keys(TYPES).map(k=>({l:TYPES[k],v:Math.round(revUSD(ss.filter(s=>s.type===k)))}));body=`<div class="g4 mb">${kpi('Revenue',usd(revUSD(ss)),'last '+n+' days','dollar')}${kpi('Avg order value',usd(revUSD(ss)/(ss.filter(paidish).length||1)),'paid orders','tag')}${kpi('Pending collection',usd(sum(ss.filter(s=>!paidish(s)&&OPENS.includes(s.status)),s=>toUSD(s.price.total,s.currency))),'unpaid and COD due','clock','warn')}${kpi('Refunded',usd(sum(ss.filter(s=>s.payStatus==='refunded'),s=>toUSD(s.price.total,s.currency))),'','wallet')}</div><div class="g2 mb">${card('Revenue per day (USD)',lineChart(dl.map(d=>({l:d.l,v:r2(revUSD(ss.filter(s=>new Date(s.created).toDateString()===d.t)))})),{fmt:shortUSD}))}${card('By payment method (USD)',`<div class="row" style="justify-content:center">${donut(byM.map((x,i)=>({...x,c:PAL[i%8]})),{center:usd(sum(byM,x=>x.v))})}</div>${legend(byM.map((x,i)=>({...x,c:PAL[i%8]})))}`)}</div>${card('By service type (USD)',barChart(byT,{fmt:shortUSD}))}`}
  if(tab==='driver'){const rows=driversScoped().map(d=>{const l=ss.filter(s=>s.driverId===d.id),dd=l.filter(s=>s.status==='delivered');return{id:d.id,name:drvName(d.id),jobs:l.length,del:dd.length,fail:l.filter(s=>['delivery_failed','returned'].includes(s.status)).length,ot:dd.length?Math.round(dd.filter(onTime).length/dd.length*100):0,rating:d.rating,earn:r2(sum(dd,s=>s.price.total*.12/DB.fx[s.currency]))}});body=`${card('Deliveries by driver',barChart(rows.map(r=>({l:r.name.split(' ')[0],v:r.del})),{}))}<div class="mt">${card('Driver report',table('rdrv',{cols:[{h:'Driver',f:r=>`<b>${esc(r.name)}</b>`,sort:r=>r.name},{h:'Jobs',f:r=>r.jobs,sort:r=>r.jobs},{h:'Delivered',f:r=>r.del,sort:r=>r.del},{h:'Failed',f:r=>r.fail,sort:r=>r.fail},{h:'On-time',f:r=>r.ot+'%',sort:r=>r.ot},{h:'Rating',f:r=>'★ '+r.rating,sort:r=>r.rating},{h:'Earnings (USD)',f:r=>usd(r.earn),cls:'right',sort:r=>r.earn}],rows:()=>rows,csv:'driver-report',pageSize:10}))}</div>`}
  return `${pageHead('Reports and analytics',(sc==='ALL'?'All cities':city(sc).name),`<select data-chg="repdays" style="width:auto">${[7,14,30].map(v=>`<option value="${v}" ${v===n?'selected':''}>Last ${v} days</option>`).join('')}</select><button class="btn" data-act="repcsv">${icon('download',14)} Export CSV</button><button class="btn" onclick="window.print()">Print</button>`)}<div class="tabs">${[['delivery','Delivery'],['revenue','Revenue'],['driver','Drivers']].map(t=>`<button class="${t[0]===tab?'on':''}" data-act="reptab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><div class="print-area">${body}</div>`};
ACT.reptab=d=>{UI.tab.rep=d.t;render()};CHG.repdays=v=>{UI.repDays=+v;render()};
ACT.repcsv=()=>{const n=UI.repDays||14,ss=scoped().filter(s=>s.created>=Date.now()-n*DAY);downloadCSV(`report-${UI.tab.rep||'delivery'}-${n}d.csv`,[['Tracking','City','Type','Status','Driver','Payment method','Payment status','Total','Currency','Created'],...ss.map(s=>[s.tracking,city(s.city).name,TYPES[s.type],STATUS[s.status],drvName(s.driverId),METHODS[s.method],s.payStatus,s.price.total,s.currency,new Date(s.created).toISOString()])])};
/* templates / outbox */
PAGES.admin.templates=()=>{const tab=UI.tab.tpl||'t';return `${pageHead('Notifications','Email, SMS and push templates and the message outbox.')}<div class="tabs"><button class="${tab==='t'?'on':''}" data-act="tpltab" data-t="t">Templates</button><button class="${tab==='o'?'on':''}" data-act="tpltab" data-t="o">Outbox (${DB.outbox.length})</button></div>${tab==='t'?card('',table('tpl',{cols:[{h:'Template',f:r=>`<b>${esc(r.name)}</b>`},{h:'Channels',f:r=>r.ch.split(',').map(c=>`<span class="pill">${c}</span>`).join(' ')},{h:'Subject',f:r=>esc(r.subject)},{h:'',f:r=>`<button class="btn sm" data-act="tpledit" data-id="${r.k}">Edit</button>`,cls:'right'}],rows:()=>DB.templates.map(t=>({...t,id:t.k})),search:false})):card('Message outbox (simulated sends)',table('obx',{cols:[{h:'Time',f:r=>fdt(r.t),sort:r=>r.t},{h:'Channel',f:r=>`<span class="pill">${r.ch}</span>`},{h:'To',f:r=>esc(r.to)},{h:'Message',f:r=>esc((r.subject?r.subject+' - ':'')+r.body).slice(0,120)}],rows:()=>DB.outbox.map((o,i)=>({...o,id:'o'+i})),filters:[{k:'c',label:'Channel',opts:[['email','Email'],['sms','SMS'],['push','Push']],fn:(r,v)=>r.ch===v}],text:r=>r.to+r.body+r.subject,pageSize:10,empty:'No messages yet. Change a shipment status to generate some.'}))}`};
ACT.tpltab=d=>{UI.tab.tpl=d.t;render()};
ACT.tpledit=d=>{const t=DB.templates.find(x=>x.k===d.id);modal('Edit template · '+t.name,`<form data-submit="tpl" data-id="${t.k}" class="col"><label class="f">Subject<input name="subject" value="${esc(t.subject)}"></label><label class="f">Body<textarea name="body" rows="4">${esc(t.body)}</textarea></label><div class="hint">Placeholders: {{name}} {{tracking}} {{driver}} {{receiver}} {{reason}} {{code}}</div><div class="card flat"><div class="muted xs">Preview</div><div class="sm">${esc(t.body.replace(/{{name}}/g,'Amara').replace(/{{tracking}}/g,'NXLOS100245').replace(/{{driver}}/g,'Femi Ojo').replace(/{{receiver}}/g,'Ada Bello').replace(/{{reason}}/g,'Receiver unavailable').replace(/{{code}}/g,'482913').replace(/{{minutes}}/g,'10'))}</div></div><div class="mfoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn pri">Save</button></div></form>`)};
SUB.tpl=(fd,d)=>{const t=DB.templates.find(x=>x.k===d.id);t.subject=fd.subject;t.body=fd.body;audit('Template','Edited '+t.name);save();closeModal();toast('Template saved');render()};

/* ================= SUPER ADMIN ================= */
PAGES.superadmin.overview=()=>{const ss=DB.shipments;return `${pageHead('Platform overview','Global health, cities and feature flags.')}<div class="g4 mb">${kpi('Users',DB.users.length,DB.users.filter(u=>u.status!=='active').length+' suspended','users')}${kpi('Cities live',DB.cities.filter(c=>c.active).length,'of '+DB.cities.length,'globe')}${kpi('Gateways enabled',Object.values(DB.gateways).filter(g=>g.on).length,'of '+Object.keys(DB.gateways).length,'card')}${kpi('Global revenue',usd(revUSD(ss)),'USD equivalent','dollar')}</div><div class="g2 mb">${card('System health (simulated)',['API gateway','PostgreSQL + PostGIS','Redis / job queue','Maps provider','SMS provider','Payment gateways'].map((x,i)=>`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${x}</span><span class="badge b-ok">Operational</span><span class="muted xs">${[42,8,3,120,260,95][i]} ms</span></div>`).join(''))}${card('Revenue by city (USD)',barChart(DB.cities.map(c=>({l:c.name,v:Math.round(revUSD(ss.filter(s=>s.city===c.id)))})),{fmt:shortUSD}))}</div>${card('Feature flags',Object.entries(DB.settings.flags).map(([k,v])=>`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${{autoDispatch:'Automatic dispatching (assign nearest driver on creation)',bulkXlsx:'Bulk upload: XLSX support',businessAccounts:'Business accounts',warehouse:'Warehouse and inventory'}[k]||k}</span>${sw('',v,'flag',k)}</div>`).join(''))}`};
CHG.flag=(v,d)=>{DB.settings.flags[d.id]=v;audit('Settings','Flag '+d.id+' = '+v);save();toast('Flag updated')};
PAGES.superadmin.roles=()=>{const rs=Object.keys(ROLES);return `${pageHead('Roles and permissions','Toggle a permission and the change applies immediately to every portal.',`<button class="btn" data-act="permreset">Reset to defaults</button>`)}${note('Try it: remove "Cancel shipments" from Customer or "Manage pricing and zones" from Admin, then use the <b>Demo role</b> switcher in the top bar to see the effect (hidden actions and 403 pages).','info')}<div class="card mt"><div class="tw"><table class="t"><thead><tr><th>Permission</th>${rs.map(r=>`<th class="right">${ROLES[r]}</th>`).join('')}</tr></thead><tbody>${PERMS.map(p=>`<tr><td><b>${p[1]}</b><div class="xs muted">${p[0]}</div></td>${rs.map(r=>{const lock=r==='superadmin'&&['role.manage','settings.manage'].includes(p[0]);return `<td class="right"><label class="sw"><input type="checkbox" ${DB.perms[r][p[0]]?'checked':''} ${lock?'disabled':''} data-chg="perm" data-r="${r}" data-p="${p[0]}"><span></span></label></td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`};
CHG.perm=(v,d)=>{DB.perms[d.r][d.p]=v;audit('Permissions',`${ROLES[d.r]}: ${d.p} = ${v}`);save();toast('Permission updated')};
ACT.permreset=()=>{for(const r of Object.keys(ROLES)){PERMS.forEach(p=>DB.perms[r][p[0]]=PERM_DEFAULT[r].includes(p[0]))}audit('Permissions','Reset to defaults');save();toast('Permissions reset');render()};
PAGES.superadmin.cities=()=>`${pageHead('Cities and currencies','Operating cities, currencies and exchange rates (per 1 USD).',`<button class="btn pri" data-act="cityadd">${icon('plus',15)} Add city</button>`)}<div class="g21"><div>${card('Cities',table('cty',{cols:[{h:'City',f:r=>`<b>${esc(r.name)}</b><div class="xs muted">${esc(r.country)}</div>`},{h:'Currency',f:r=>`${r.cur} (${r.sym})`},{h:'FX per USD',f:r=>DB.fx[r.cur]},{h:'Zones',f:r=>r.zones.join(', ')},{h:'Active',f:r=>sw('',r.active,'cityact',r.id)},{h:'',f:r=>`<button class="btn sm" data-act="cityedit" data-id="${r.id}">Edit</button>`,cls:'right'}],rows:()=>DB.cities,search:false}))}</div><div>${card('Customer display currency',`<p class="muted sm">Customers and staff can switch between local currency and USD from the top bar. Reports aggregate in USD using these rates.</p><div class="note info">Live FX feed integration is a Phase 2 item. Rates are entered manually.</div>`)}</div></div>`;
CHG.cityact=(v,d)=>{byId(DB.cities,d.id).active=v;audit('City',d.id+' active='+v);save();toast('City updated')};
ACT.cityedit=d=>{const c=byId(DB.cities,d.id);modal('Edit '+c.name,`<form data-submit="city" data-id="${c.id}" class="fgrid"><label class="f">Name<input name="name" value="${esc(c.name)}" required></label><label class="f">Country<input name="country" value="${esc(c.country)}" required></label><label class="f">FX rate (${c.cur} per USD)<input type="number" step="any" name="fx" value="${DB.fx[c.cur]}" required></label><label class="f">Symbol<input name="sym" value="${esc(c.sym)}" required></label>${c.zones.map((z,i)=>`<label class="f">Zone ${i+1}<input name="z${i}" value="${esc(z)}" required></label>`).join('')}<div class="full mfoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn pri">Save</button></div></form>`)};
SUB.city=(fd,d)=>{const c=byId(DB.cities,d.id);c.name=fd.name;c.country=fd.country;c.sym=fd.sym;c.zones=[0,1,2,3].map(i=>fd['z'+i]);DB.fx[c.cur]=+fd.fx;audit('City','Edited '+c.name);save();closeModal();toast('City saved');render()};
ACT.cityadd=()=>modal('Add city',`<form data-submit="cityNew" class="fgrid"><label class="f">City code (3 letters)<input name="id" maxlength="3" required placeholder="KLA"></label><label class="f">Name<input name="name" required></label><label class="f">Country<input name="country" required></label><label class="f">Currency code<input name="cur" maxlength="3" required placeholder="UGX"></label><label class="f">Symbol<input name="sym" required></label><label class="f">FX rate (per USD)<input type="number" step="any" name="fx" required></label><div class="full hint">Rates are copied from Lagos scaled by exchange rate. Edit them in Pricing afterwards.</div><div class="full mfoot"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn pri">Add city</button></div></form>`);
SUB.cityNew=fd=>{const id=fd.id.toUpperCase();if(DB.cities.some(c=>c.id===id))return toast('City code exists','bad');const cur=fd.cur.toUpperCase(),f=+fd.fx/DB.fx.NGN;DB.fx[cur]=+fd.fx;DB.cities.push({id,name:fd.name,country:fd.country,cur,sym:fd.sym,active:true,zones:['North West','North East','South West','South East']});const L=DB.rules.LOS;DB.rules[id]={base:Math.round(L.base*f),perKm:r2(L.perKm*f),perKg:r2(L.perKg*f),min:Math.round(L.min*f),zone:Math.round(L.zone*f),tax:.1,mult:{...L.mult}};audit('City','Added '+fd.name);save();closeModal();toast('City added');render()};
PAGES.superadmin.gateways=()=>{const GW=[['binance','Binance Pay','Crypto checkout in USDT (merchant API, simulated)','binance'],['bybit','Bybit Pay','Crypto checkout in USDT (merchant API, simulated)','bybit'],['card','Card payments','Cards via a hosted gateway page (Paystack / Flutterwave / Stripe decision pending)'],['bank','Bank transfer','Virtual account with manual or webhook confirmation'],['wallet','Customer wallet','Prepaid wallet balance'],['cod','Cash on delivery','Collected by driver, reconciled by admin']];
  return `${pageHead('Payment gateways','Enable or disable what customers see at checkout.')}${note('<b>Simulation only.</b> No real Binance, Bybit, Paystack, Flutterwave or Stripe integration exists in this prototype. The production gateway choice is still to be decided.','info')}<div class="g2 mt">${GW.map(g=>{const c=DB.gateways[g[0]];return `<div class="card"><div class="row between"><div class="row"><h3>${g[1]}</h3>${g[3]?`<span class="chip ${g[3]}">${g[3]==='binance'?'BINANCE':'BYBIT'}</span>`:''}</div>${sw('',c.on,'gw',g[0])}</div><p class="muted sm">${g[2]}</p>${c.key?`<dl class="kvs mt"><dt>API key</dt><dd>${c.key}</dd><dt>Webhook</dt><dd class="xs">https://api.nexus.demo/webhooks/${g[0]}</dd><dt>Settlement</dt><dd>USDT</dd></dl><button class="btn sm mt" data-act="gwtest" data-id="${g[0]}">Send test webhook</button>`:''}</div>`}).join('')}</div>`};
CHG.gw=(v,d)=>{DB.gateways[d.id].on=v;audit('Gateway',d.id+' enabled='+v);save();toast(DB.gateways[d.id].label+(v?' enabled':' disabled'))};
ACT.gwtest=d=>{toast(DB.gateways[d.id].label+' test webhook received and verified (simulated)')};
PAGES.superadmin.integrations=()=>{const keys=DB.apiKeys=DB.apiKeys||[{id:'k1',name:'ERP connector',key:'nx_live_••••••••9a1c',t:Date.now()-30*DAY}];return `${pageHead('Integrations','External services and API access.')}<div class="g3 mb">${[['Mapbox Maps','Geocoding, directions, distance matrix','pin'],['SMS provider','OTP and status messages','phone'],['Email provider','Receipts and notifications','mail'],['Push (FCM / APNs)','Driver app notifications (Capacitor, Phase 2)','bell'],['Payment gateways','See Payment gateways','card'],['FX rates feed','Phase 2','dollar']].map((x,i)=>`<div class="card"><div class="row between"><div class="kic">${icon(x[2],18)}</div><span class="badge b-${i<3||i===4?'ok':'muted'}">${i<3||i===4?'Connected (sample)':'Planned'}</span></div><h3 class="mt">${x[0]}</h3><div class="muted sm">${x[1]}</div></div>`).join('')}</div>${card('Partner API keys',table('keys',{cols:[{h:'Name',f:r=>`<b>${esc(r.name)}</b>`},{h:'Key',f:r=>`<code>${r.key}</code>`},{h:'Created',f:r=>fdate(r.t)},{h:'',f:r=>`<button class="btn sm bad" data-act="keydel" data-id="${r.id}">Revoke</button>`,cls:'right'}],rows:()=>DB.apiKeys,search:false,empty:'No API keys'}),`<button class="btn pri sm" data-act="keyadd">Generate key</button>`)}<p class="muted xs mt">Partner API is a Phase 2 feature; this screen previews key management.</p>`};
ACT.keyadd=()=>{DB.apiKeys.push({id:'k'+Date.now(),name:'Partner key '+(DB.apiKeys.length+1),key:'nx_live_'+hex(8)+'••••••••',t:Date.now()});audit('API key','Generated');save();toast('API key generated (simulated)');render()};
ACT.keydel=d=>{DB.apiKeys=DB.apiKeys.filter(k=>k.id!==d.id);save();toast('Key revoked');render()};
PAGES.superadmin.settings=()=>{const s=DB.settings;return `${pageHead('System settings')}<div class="g2"><div class="card"><h3 class="mb">Driver app</h3><div class="row between"><div><b>Capacitor background GPS mode</b><div class="muted sm">Simulates the Phase 2 wrapped app. When on, drivers keep reporting location with the screen locked.</div></div>${sw('',s.capacitorBg,'capbg')}</div></div><div class="card"><h3 class="mb">Security</h3><label class="f">OTP expiry (minutes)<select data-chg="otpmin" style="max-width:160px">${[5,10,15].map(v=>`<option ${s.otpMin===v?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="card"><h3 class="mb">Notification channels</h3>${[['email','Email'],['sms','SMS'],['push','Push'],['inapp','In-app']].map(([k,l])=>`<div class="row between" style="padding:6px 0"><span>${l}</span>${sw('',s.channels[k],'chan',k)}</div>`).join('')}</div><div class="card"><h3 class="mb">Language</h3><label class="f">Interface language<select disabled><option>English (default)</option><option>French (Phase 2)</option><option>Swahili (Phase 2)</option></select></label><p class="muted xs mt">Translation files are structured from day one; additional languages are Phase 2.</p></div></div>`};
CHG.capbg=v=>{DB.settings.capacitorBg=v;audit('Settings','Capacitor background mode='+v);save();toast(v?'Capacitor background GPS mode on':'PWA foreground-only mode')};
CHG.otpmin=v=>{DB.settings.otpMin=+v;save();toast('OTP expiry updated')};CHG.chan=(v,d)=>{DB.settings.channels[d.id]=v;save();toast('Channel updated')};
PAGES.superadmin.audit=()=>`${pageHead('Audit log','Every sensitive action, with who and when.')}${card('',table('aud',{cols:[{h:'Time',f:r=>fdt(r.t),sort:r=>r.t},{h:'User',f:r=>`<b>${esc(r.by)}</b>`},{h:'Role',f:r=>`<span class="pill">${ROLES[r.role]||r.role}</span>`},{h:'Action',f:r=>esc(r.a)},{h:'Detail',f:r=>esc(r.d)}],rows:()=>DB.audit.map((a,i)=>({...a,id:'a'+i})),csv:'audit-log',filters:[{k:'r',label:'Role',opts:Object.entries(ROLES),fn:(r,v)=>r.role===v}],text:r=>r.by+r.a+r.d,pageSize:12}))}`;
PAGES.superadmin.admins=()=>`${pageHead('Admin users','Create and manage platform administrators.',`<button class="btn pri" data-act="useradd">${icon('plus',15)} Add user</button>`)}${card('',table('adm',{cols:[{h:'Name',f:r=>`<b>${esc(r.name)}</b><div class="xs muted">${esc(r.email)}</div>`},{h:'Role',f:r=>`<span class="pill">${ROLES[r.role]}</span>`},{h:'Status',f:r=>`<span class="badge b-${r.status==='active'?'ok':'bad'}">${r.status}</span>`},{h:'',f:r=>`<button class="btn sm" data-act="useredit" data-id="${r.id}">Edit</button> ${r.id!==me().id?`<button class="btn sm bad" data-act="usertoggle" data-id="${r.id}">${r.status==='active'?'Suspend':'Activate'}</button>`:''}`,cls:'right'}],rows:()=>DB.users.filter(u=>['admin','superadmin'].includes(u.role)),search:false}))}`;

/* ================= BOOT ================= */
const __render=render;
render=function(){__render();if(parseHash().page==='bulk')bindBulk()};
DB=load();if(!DB){DB=seed();save()}
DB.perms=DB.perms||{};
setInterval(tick,1000);
render();
</script>
